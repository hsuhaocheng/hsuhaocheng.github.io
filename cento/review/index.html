/* ================= WebM retiming =================
 *
 * MediaRecorder stamps each frame with the wall-clock moment it was captured,
 * so its WebM jitters by a few milliseconds a frame, and it has no duration
 * and no index: stepping through it frame by frame is unreliable. The encoded
 * frames themselves are fine. This takes them out and writes a clean WebM
 * around them -- frame k at exactly k / fps, a declared frame duration, the
 * real duration, known element sizes, and a cue at every keyframe.
 *
 * Only what MediaRecorder writes is handled: one video track, frames as
 * SimpleBlocks or BlockGroups (Chrome versions differ), no lacing. Anything else throws, and the caller keeps the original file.
 */
const EB = {
  EBML: 0x1A45DFA3, SEGMENT: 0x18538067, SEEKHEAD: 0x114D9B74, INFO: 0x1549A966,
  TRACKS: 0x1654AE6B, TRACKENTRY: 0xAE, TRACKNUM: 0xD7, TRACKTYPE: 0x83,
  CODECID: 0x86, CODECPRIV: 0x63A2, VIDEO: 0xE0, PIXW: 0xB0, PIXH: 0xBA,
  CLUSTER: 0x1F43B675, TIMECODE: 0xE7, SIMPLEBLOCK: 0xA3, BLOCKGROUP: 0xA0, BLOCK: 0xA1, REFBLOCK: 0xFB,
  CUES: 0x1C53BB6B
};

// an EBML ID (marker bits kept) or size (marker bits dropped) at p
function ebRead(d, p, isId){
  if(p >= d.length) throw new Error("檔尾不完整");
  const b = d[p];
  let len = 1, mask = 0x80;
  while(len <= 8 && !(b & mask)){ len++; mask >>= 1; }
  if(len > (isId ? 4 : 8) || p + len > d.length) throw new Error("EBML 格式錯誤 @" + p);
  let v = isId ? b : (b & (mask - 1));
  let unknown = !isId && v === mask - 1;
  for(let k = 1; k < len; k++){
    v = v * 256 + d[p + k];
    if(d[p + k] !== 0xFF) unknown = false;
  }
  return { len, v, unknown };
}

function webmFrames(d){
  const entries = [], frames = [];
  let track = null, group = -1, refFirst = false;
  const enter = new Set([EB.SEGMENT, EB.CLUSTER, EB.TRACKS, EB.TRACKENTRY, EB.VIDEO, EB.BLOCKGROUP]);
  let p = 0;
  while(p < d.length){
    const id = ebRead(d, p, true);
    const sz = ebRead(d, p + id.len, false);
    const body = p + id.len + sz.len;
    if(enter.has(id.v)){
      if(id.v === EB.TRACKENTRY) entries.push({ num: 0, type: 0, codec: "", priv: null, w: 0, h: 0 });
      if(id.v === EB.BLOCKGROUP){ group = -1; refFirst = false; }
      p = body;
      continue;
    }
    if(sz.unknown) throw new Error("不支援未知長度的元素 0x" + id.v.toString(16));
    const end = body + sz.v;
    if(end > d.length) break;                 // a cut-off tail: keep what is whole
    const e = entries[entries.length - 1];
    const uint = () => { let v = 0; for(let k = body; k < end; k++) v = v * 256 + d[k]; return v; };
    switch(id.v){
      case EB.TRACKNUM:  if(e) e.num = uint(); break;
      case EB.TRACKTYPE: if(e) e.type = uint(); break;
      case EB.CODECID:   if(e) e.codec = new TextDecoder().decode(d.subarray(body, end)); break;
      case EB.CODECPRIV: if(e) e.priv = d.subarray(body, end); break;
      case EB.PIXW:      if(e) e.w = uint(); break;
      case EB.PIXH:      if(e) e.h = uint(); break;
      case EB.SIMPLEBLOCK:
      case EB.BLOCK: {
        if(!track){
          track = entries.find(x => x.type === 1 || x.codec.indexOf("V_") === 0);
          if(!track) throw new Error("找不到影像軌");
        }
        const tn = ebRead(d, body, false);
        if(tn.v !== track.num) break;
        const flags = d[body + tn.len + 2];
        if(flags & 0x06) throw new Error("不支援 lacing");
        const data = d.subarray(body + tn.len + 3, end);
        // a Block's flags have no keyframe bit: it is a keyframe unless its
        // group carries a ReferenceBlock. VP8 marks key frames in the frame
        // itself (bit 0 of the first byte is 0), which is the surer answer.
        let key = id.v === EB.SIMPLEBLOCK ? !!(flags & 0x80) : !refFirst;
        if(track.codec === "V_VP8" && data.length) key = (data[0] & 1) === 0;
        if(id.v === EB.BLOCK) group = frames.length;
        frames.push({ key, data });
        break;
      }
      case EB.REFBLOCK:
        if(track && track.codec === "V_VP8") break;
        if(group >= 0) frames[group].key = false; else refFirst = true;
        break;
    }
    p = end;
  }
  if(!track) throw new Error("沒有畫格");
  return { track, frames };
}

function ebId(id){
  const a = [];
  for(let v = id; v > 0; v = Math.floor(v / 256)) a.unshift(v % 256);
  return Uint8Array.from(a);
}
function ebSize(n){
  let len = 1;
  while(len < 8 && n >= Math.pow(2, 7 * len) - 1) len++;
  const a = new Uint8Array(len);
  for(let k = len - 1, v = n; k >= 0; k--, v = Math.floor(v / 256)) a[k] = v % 256;
  a[0] |= 1 << (8 - len);
  return a;
}
function ebUint(n, bytes){
  let len = bytes || 1;
  if(!bytes) while(len < 8 && n >= Math.pow(2, 8 * len)) len++;
  const a = new Uint8Array(len);
  for(let k = len - 1, v = n; k >= 0; k--, v = Math.floor(v / 256)) a[k] = v % 256;
  return a;
}
const ebLen = parts => parts.reduce((t, x) => t + x.length, 0);
function ebEl(id, parts){
  const out = [ebId(id), ebSize(ebLen(parts))];
  for(const x of parts) out.push(x);
  return out;
}
const ebU = (id, n) => ebEl(id, [ebUint(n)]);
const ebS = (id, t) => ebEl(id, [new TextEncoder().encode(t)]);
const ebF = (id, x) => { const b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, x); return ebEl(id, [b]); };
const ebCat = (...lists) => { const out = []; for(const l of lists) for(const x of l) out.push(x); return out; };

function remuxWebm(d, fps){
  const { track, frames } = webmFrames(d);
  if(!frames.length) throw new Error("沒有畫格");
  if(!frames[0].key) throw new Error("第一格不是關鍵格");
  const at = k => Math.round(k * 1000 / fps);          // ms, TimecodeScale 1 ms

  const header = ebEl(EB.EBML, ebCat(
    ebU(0x4286, 1), ebU(0x42F7, 1), ebU(0x42F2, 4), ebU(0x42F3, 8),
    ebS(0x4282, "webm"), ebU(0x4287, 4), ebU(0x4285, 2)));

  const info = ebEl(EB.INFO, ebCat(
    ebU(0x2AD7B1, 1000000), ebF(0x4489, frames.length * 1000 / fps),
    ebS(0x4D80, "CENTO"), ebS(0x5741, "CENTO")));

  const tracks = ebEl(EB.TRACKS, ebEl(EB.TRACKENTRY, ebCat(
    ebU(EB.TRACKNUM, 1), ebU(0x73C5, 1), ebU(EB.TRACKTYPE, 1), ebU(0x9C, 0),
    ebS(EB.CODECID, track.codec),
    track.priv ? ebEl(EB.CODECPRIV, [track.priv]) : [],
    ebU(0x23E383, Math.round(1e9 / fps)),               // DefaultDuration, ns
    ebEl(EB.VIDEO, ebCat(ebU(EB.PIXW, track.w), ebU(EB.PIXH, track.h))))));

  // SeekHead positions are written as 8-byte numbers, so its size is fixed
  const seek = (id, pos) => ebEl(0x4DBB, ebCat(ebEl(0x53AB, [ebId(id)]), ebEl(0x53AC, [ebUint(pos, 8)])));
  const seekHead = (a, b, c) => ebEl(EB.SEEKHEAD, ebCat(seek(EB.INFO, a), seek(EB.TRACKS, b), seek(EB.CUES, c)));
  const headLen = ebLen(seekHead(0, 0, 0));

  let pos = headLen + ebLen(info) + ebLen(tracks);
  const clusters = [], cues = [];
  let k = 0;
  while(k < frames.length){
    const start = k, t0 = at(k), blocks = [];
    let size = 0;
    do{
      const fr = frames[k], rel = at(k) - t0;
      const head = new Uint8Array([0x81, (rel >> 8) & 0xFF, rel & 0xFF, fr.key ? 0x80 : 0x00]);
      for(const x of ebEl(EB.SIMPLEBLOCK, [head, fr.data])) blocks.push(x);
      size += fr.data.length;
      k++;
    }while(k < frames.length && !frames[k].key && at(k) - t0 < 30000 && size < 8000000);
    const cl = ebEl(EB.CLUSTER, ebCat(ebU(EB.TIMECODE, t0), blocks));
    if(frames[start].key)
      for(const x of ebEl(0xBB, ebCat(ebU(0xB3, t0),
          ebEl(0xB7, ebCat(ebU(0xF7, 1), ebU(0xF1, pos)))))) cues.push(x);
    for(const x of cl) clusters.push(x);
    pos += ebLen(cl);
  }

  const body = ebCat(
    seekHead(headLen, headLen + ebLen(info), pos),
    info, tracks, clusters, ebEl(EB.CUES, cues));
  const segment = ebCat([ebId(EB.SEGMENT), ebSize(ebLen(body))], body);
  return { blob: new Blob(ebCat(header, segment), { type: "video/webm" }), frames: frames.length };
}

/* ---------- media ---------- */
function mediaURL(m){
  try{
    if(!m) return null;
    if(m.kind === "data") return m.uri || null;
    if(m.kind === "web") return m.url || null;          // the host's picture, in 網頁看片
    if(m.kind === "path") return inAE ? CEP.fileURL(m.path, (m.t || 0) + blobBust) : null;
    return null;
  }catch(err){
    console.error("[cento] mediaURL", err);
    return null;
  }
}

/* ---------- timing ---------- */
const fps = () => Math.max(1, Math.min(120, Number(P.fps) || 24));
const frames = () => P.cuts.reduce((a,c) => a + (isBlank(c) ? 0 : Math.max(1, c.frames|0)), 0);
// where cut n starts in the film 雲端看片 plays: the host writes it, else the timeline
function vStart(n){ const c = P.cuts[n]; return c && c.vStart != null ? c.vStart : startFrame(n); }
function startFrame(n){ let s=0; for(let k=0;k<n;k++) s += isBlank(P.cuts[k]) ? 0 : Math.max(1, P.cuts[k].frames|0); return s; }
function tc(f){
  if(!isFinite(f) || f < 0) return "—";
  const F = fps(), t = f/F;
  return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0")
    +"."+String(Math.floor(f%F)).padStart(2,"0");
}
const secsOf = c => (Math.max(1, c.frames|0)/fps()).toFixed(2);

/* ---------- persistence ---------- */
/* There is no Save button any more, so every edit schedules a write. Debounced
   so a burst of typing costs one write, not one per keystroke. */
let saveTimer = null;
let locked = false;          // this board must not be written: see readBoard
function markDirty(){
  dirty = true;
  saveState("儲存中…");
  if(!locked) try{ localStorage.setItem(LS, JSON.stringify(P)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 1200);
}
function markClean(){ dirty = false; saveState(locked ? "不會存檔" : "已存檔"); }
function saveState(t){ $("dot").textContent = t; $("dot").classList.toggle("dirty", t !== "已存檔"); }

/* The board belongs to the AE project, not to the extension. Keeping one shared
   file meant switching projects carried the previous project's notes, status
   marks and frame paths across. */
function boardPathFor(projectPath){
  if(!projectPath) return null;
  const p = String(projectPath).replace(/\\/g, "/");
  const dir = p.replace(/\/[^/]*$/, "");
  return dir + "/" + baseName(p) + ".cento.json";
}

const NEWER = "你的看板檔是安全的：它是較新版的 CENTO 存的";
function unlockNotice(){
  if(!locked && $("bannerMsg").textContent.indexOf(NEWER) === 0) $("banner").hidden = true;
}
/* -> { board, locked } or null when there is no board at that path yet.
   A newer format is shown but locked. A file that is not a board is copied
   aside before a new board takes its place ({ board: null }); if even that
   fails, or the file cannot be read at all, the new board is locked too, so
   the file is never lost to an autosave. */
function loadBoard(path){
  if(!path || !inAE) return null;
  let raw;
  try{ raw = CEP.readText(path); }
  catch(e){
    showError("你的看板檔是安全的：CENTO 這次讀不到它，所以不會寫入。請確認檔案沒有被其他程式佔用，再重新開啟面板。（" + e.message + "）");
    return { board: null, locked: true };
  }
  if(!raw) return null;
  let data = null;
  try{ data = JSON.parse(raw); }catch(e){}
  const r = migrateBoard(data);
  if(r.locked){
    warn(NEWER + "（格式 v" + data.v + "，這一版只懂到 v" + FORMAT +
         "）。這一版只會顯示、不會寫入它；請更新 CENTO 後再編輯。");
    return r;
  }
  if(r.board) return r;
  const aside = path.replace(/\.json$/i, "") + ".unreadable-" + Date.now() + ".json";
  try{ CEP.writeText(aside, raw); }
  catch(e){
    showError("你的看板檔是安全的：CENTO 讀不懂它，也沒辦法另存備份，所以這次不會寫入。檔案在 " + path);
    return { board: null, locked: true };
  }
  showError("你的看板檔是安全的：CENTO 讀不懂它，已原樣另存成 " + aside + "。這次改用新的看板；需要時可以把那份檔案寄給開發者。");
  return { board: null, locked: false };
}

/* Called after a scan, once we know which project we are looking at. */
function useProject(projectPath){
  setTitle(projectPath);
  const proj = projectPath || "";
  if(!proj){
    // an unsaved project has no folder of its own: it uses the shared board in
    // the extension folder, just as its frames and videos go there
    const ext = inAE ? CEP.extensionPath() : "";
    const shared = ext ? ext + "/data/project.json" : null;
    if(!shared || (savePath === shared && !P.project)) return;
    if(dirty) save();
    const found = loadBoard(shared);
    locked = !!(found && found.locked);
    unlockNotice();
    P = (found && found.board) || { v:FORMAT, title:"", fps:P.fps || 24, who:P.who || "", project:"", cuts:[] };
    P.project = "";
    normalizeBoard(P);
    savePath = shared;
    blobBust = Date.now();
    markClean();
    toast("AE 的專案還沒存檔，改用共用看板。");
    return;
  }
  if(P.project === proj && savePath){ return; }

  if(dirty) save();                          // don't lose the board we are leaving
  const path = boardPathFor(proj);
  const found = loadBoard(path);
  locked = !!(found && found.locked);
  unlockNotice();
  P = (found && found.board) || { v:FORMAT, title:baseName(proj), fps:P.fps || 24,
                 who:P.who || "", project:proj, cuts:[] };
  P.project = proj;
  normalizeBoard(P);
  savePath = path;
  blobBust = Date.now();
  markClean();
  toast(found && found.board ? ("已載入 " + baseName(proj) + " 的看板。")
              : ("新專案 " + baseName(proj) + "，建立新的看板。"));
}

function boot(){
  if(CLOUD && !window.CENTO_WEB.state){
    CC.ready.then(st => { window.CENTO_WEB.state = st; boot(); }, err => showError(String(err && err.message || err)));
    return;
  }
  let loaded = null, found = null;
  if(WEB){
    loaded = window.CENTO_WEB.state.board;
    locked = true;                    // nothing is saved here; the host keeps the board
    document.body.classList.add("web", "mt-notes");
    if(CLOUD){ document.body.classList.add("cloud"); CC.redraw = () => { drawFrame(); drawMarks(); }; }
  }else if(inAE){
    const ext = CEP.extensionPath();
    if(ext){
      CEP.makeDir(ext + "/data");
      savePath = ext + "/data/project.json";
    }
    found = loadBoard(savePath);
    if(found){ loaded = found.board; locked = found.locked; }
    CEP.call("cntHello", []).then(h => { aeVersion = String(h.version || ""); }).catch(() => {});
  }else{
    $("aeSync").disabled = true;
    warn("這個頁面不是在 After Effects 裡開的，所以讀不到合成。把整個 extension 資料夾裝成 CEP 擴充功能後，從 AE 的 Window > Extensions 開啟。");
  }
  // the local copy only stands in when there is no board file at all, and
  // never when it is a newer format
  if(!found && !WEB){
    try{
      const r = localStorage.getItem(LS);
      const m = r ? migrateBoard(JSON.parse(r)) : null;
      if(m && m.board && !m.locked) loaded = m.board;
    }catch(e){}
  }
  P = (loaded && Array.isArray(loaded.cuts) && loaded.cuts.length) ? loaded : seedProject();
  normalizeBoard(P);
  renderWho();
  if(inAE){
    $("addCut").title = "在這一卡後面插入空號";
    $("delCut").title = "刪除空號（AE 來的卡請在 AE 裡刪）";
  }
  renderAll(); saveState(CLOUD ? "雲端看片" : WEB ? "網頁看片" : locked ? "不會存檔" : "已存檔");
  scheduleSeqSync();
}

function framesDirFor(info){

    CEP.makeDir(dir); return dir;

/* ================= cut numbers and identity =================
 * A board cell is one of three kinds:
 *   a cut (kind unset)   takes the next whole number
 *   a blank ("blank")    takes a whole number and has no picture, so the cuts
 *                        after a deleted one can keep their numbers
 *   a suffix ("suffix")  the previous whole number plus A, B, C..., taking no
 *                        number, so an added cut pushes nothing back
 * Numbers are never kept as the truth: they are worked out from the order
 * whenever anything changes. Sync matches AE's cuts to the board in timeline
 * order (planSync), so text, notes, marks and frames stay with their cut.
 */
const isBlank = c => !!c && c.kind === "blank";

function suffixLetters(k){
  let out = "", v = k + 1;
  while(v > 0){ const r = (v - 1) % 26; out = String.fromCharCode(65 + r) + out; v = Math.floor((v - 1) / 26); }
  return out;
}

function renumber(cuts){
  let whole = 0, sub = 0;
  for(const c of cuts){
    if(c.kind === "suffix"){ c.no = String(whole).padStart(3, "0") + suffixLetters(sub++); }
    else { whole++; sub = 0; c.no = String(whole).padStart(3, "0"); }
  }
  return cuts;
}

function newBlank(extra){
  return Object.assign({ id: uid(), kind: "blank", no: "", seg: "", segname: "", frames: 0,
    pic: "", act: "", se: "", media: null, aeName: null, status: "", notes: [], marks: {},
    seqDir: null, seqHave: [] }, extra || {});
}

/* a board read from disk: every cell gets its own id -- older syncs could give
   two cuts the same one, and ids name frame files -- then numbers afresh */
function normalizeBoard(board){
  const seen = new Set();
  board.cuts.forEach(c => {
    if(!c.id || seen.has(c.id)){ c.id = uid(); c.seqHave = []; c.seqDir = null; }
    seen.add(c.id);
    if(!c.notes) c.notes = [];
    if(!c.marks) c.marks = {};
    if(!c.seqHave) c.seqHave = [];
  });
  renumber(board.cuts);
  return board;
}

/* The board file is shared with other tools (SOMA reads and writes it), so the
   panel keeps every field it does not know and never writes over a newer
   format. docs/FORMAT.md is the spec; FORMAT goes up only when an existing
   field changes meaning, and each step up adds its migration here. */
const FORMAT = 1;
const CUT_FIELDS = new Set(["id", "kind", "no", "seg", "segname", "frames", "pic", "act", "se",
  "aeName", "aeIn", "aeInF", "aeAt", "aeAtF", "aeSrc", "status", "notes", "marks",
  "seqDir", "seqHave", "media", "wasNo", "wasName"]);
function extraFields(c){
  const x = {};
  if(c) for(const k in c) if(!CUT_FIELDS.has(k)) x[k] = c[k];
  return x;
}

/* -> { board, locked }. board null = not a board at all; locked = a newer
   format: show it, never save it. */
function migrateBoard(data){
  if(!data || typeof data !== "object" || !Array.isArray(data.cuts)
     || !data.cuts.every(c => c && typeof c === "object")) return { board: null, locked: false };
  const v = data.v == null ? 1 : Number(data.v);
  if(!(v >= 1) || Math.floor(v) !== v) return { board: null, locked: false };
  if(v > FORMAT) return { board: data, locked: true };
  // v1 is current. A later format adds its step here: if(data.v === 1){ ...; data.v = 2; }
  data.v = FORMAT;
  return { board: data, locked: false };
}

/* Match the cuts AE reports (scan, timeline order) to the board's cells.
 *  1. Longest common subsequence on identity: the same layer name and, when
 *     both sides know it, the same footage at the same place inside it.
 *     Order settles repeated names.
 *  2. Between two matched cuts, as many unmatched on each side are paired in
 *     order: the same slot with other footage is still the same cut.
 *  3. What is left was deleted (board only) or added (AE only).
 * Blanks stay after the cut they followed. A board never linked to AE (the
 * storyboard seed) takes its text by position on its first sync, no report.
 */
function planSync(oldCuts, scan){
  const same = (o, a) => o.aeName === a.name && (!o.aeSrc || !a.src || o.aeSrc === a.src);
  const build = (a, prev, keep) => {
    const c = {
      id: prev ? prev.id : uid(), no: "",
      seg: prev ? prev.seg : "", segname: prev ? prev.segname : "",
      pic: prev ? prev.pic : "", act: prev ? prev.act : "", se: prev ? prev.se : "",
      frames: a.frames, aeName: a.name, aeIn: a["in"], aeInF: a.inF, aeAt: a.at, aeAtF: a.atF,
      aeSrc: a.src || "",
      status: prev ? (prev.status || "") : "",
      notes: prev && prev.notes ? prev.notes : [],
      marks: prev && prev.marks ? prev.marks : {},
      seqDir: prev ? prev.seqDir : null,
      // other footage, or another length: the old frames no longer show this cut
      seqHave: (prev && keep && prev.frames === a.frames && prev.seqHave) ? prev.seqHave : [],
      media: prev && (keep || !prev.aeName) ? prev.media : null
    };
    Object.assign(c, extraFields(prev));      // another tool's data stays with its cut
    if(prev && prev.kind === "suffix") c.kind = "suffix";
    return c;
  };

  const linked = oldCuts.filter(c => !isBlank(c) && c.aeName);
  if(!linked.length){
    const cuts = [];
    let p = 0;
    for(const o of oldCuts){
      if(isBlank(o)){ cuts.push(o); continue; }
      if(p < scan.length){ cuts.push(build(scan[p], o, false)); p++; }
    }
    for(; p < scan.length; p++) cuts.push(build(scan[p], null, false));
    return { cuts: renumber(cuts), deleted: [], added: [], first: true };
  }

  const O = linked, N = scan, m = O.length, n = N.length;
  const L = [];
  for(let a = 0; a <= m; a++) L.push(new Uint16Array(n + 1));
  for(let a = m - 1; a >= 0; a--)
    for(let b = n - 1; b >= 0; b--)
      L[a][b] = same(O[a], N[b]) ? L[a + 1][b + 1] + 1 : Math.max(L[a + 1][b], L[a][b + 1]);
  const pairs = [];
  for(let a = 0, b = 0; a < m && b < n; ){
    if(same(O[a], N[b])){ pairs.push([a, b]); a++; b++; }
    else if(L[a + 1][b] >= L[a][b + 1]) a++;
    else b++;
  }

  const match = new Map();            // index in scan -> { prev, keep }
  const gone = new Set();             // ids of board cuts that are no longer in AE
  const bounds = [[-1, -1]].concat(pairs, [[m, n]]);
  for(let k = 0; k + 1 < bounds.length; k++){
    const pa = bounds[k][0], pb = bounds[k][1], qa = bounds[k + 1][0], qb = bounds[k + 1][1];
    if(k > 0) match.set(pb, { prev: O[pa], keep: true });
    const olds = [], news = [];
    for(let a = pa + 1; a < qa; a++) olds.push(O[a]);
    for(let b = pb + 1; b < qb; b++) news.push(b);
    if(olds.length && olds.length === news.length) olds.forEach((o, j) => match.set(news[j], { prev: o, keep: false }));
    else olds.forEach(o => gone.add(o.id));
  }

  const added = [];
  const realNew = N.map((a, b) => {
    const mt = match.get(b);
    const c = build(a, mt ? mt.prev : null, mt ? mt.keep : false);
    if(!mt) added.push(c.id);
    return c;
  });

  // every blank, and every deleted cut, hangs after the nearest earlier cut
  // that is still there ("" = the very start)
  const survivors = new Set();
  match.forEach(v => survivors.add(v.prev.id));
  const blanksAfter = new Map();
  const deleted = [];
  let anchor = "";
  oldCuts.forEach((c, at) => {
    if(isBlank(c)){
      if(!blanksAfter.has(anchor)) blanksAfter.set(anchor, []);
      blanksAfter.get(anchor).push(c);
    }else if(survivors.has(c.id)){
      anchor = c.id;
    }else if(gone.has(c.id)){
      const next = oldCuts.slice(at + 1).find(x => isBlank(x) || survivors.has(x.id));
      deleted.push({ id: c.id, no: c.no, name: c.aeName || "", anchor, before: next ? next.id : "",
                     seq: deleted.length, blankId: uid() });
    }
    // a cut added by hand on a linked board has no layer: it goes, as before
  });

  const cuts = [];
  (blanksAfter.get("") || []).forEach(x => cuts.push(x));
  realNew.forEach(c => {
    cuts.push(c);
    (blanksAfter.get(c.id) || []).forEach(x => cuts.push(x));
  });
  return { cuts: renumber(cuts), deleted, added, first: false };
}

/* Keep (or give back) a deleted cut's number as a blank: it goes where the cut
   was -- before the cell that followed it, else after the cut before it --
   and deleted neighbours keep their original order whichever is clicked first. */
function placeBlank(cuts, d, all){
  const at = cuts.findIndex(c => c.id === d.blankId);
  if(at >= 0){ cuts.splice(at, 1); return renumber(cuts); }
  let pos = d.before ? cuts.findIndex(c => c.id === d.before) : -1;
  if(pos < 0){
    if(!d.anchor) pos = 0;
    else { const a = cuts.findIndex(c => c.id === d.anchor); pos = a >= 0 ? a + 1 : cuts.length; }
  }
  const peers = (all || []).filter(x => x !== d && x.anchor === d.anchor && x.before === d.before);
  const earlier = new Set(peers.filter(x => x.seq < d.seq).map(x => x.blankId));
  const later = new Set(peers.filter(x => x.seq > d.seq).map(x => x.blankId));
  while(pos > 0 && cuts[pos - 1] && later.has(cuts[pos - 1].id)) pos--;
  while(pos < cuts.length && earlier.has(cuts[pos].id)) pos++;
  cuts.splice(pos, 0, newBlank({ id: d.blankId, wasNo: d.no, wasName: d.name || "" }));
  return renumber(cuts);
}
/* ================= end of cut numbers ================= */

let lastSync = null;

function mergeTiming(info){
  const old = new Map(P.cuts.map(c => [c.id, c]));
  const plan = planSync(P.cuts, info.cuts);
  const fps = Math.round(info.fps * 1000) / 1000, refps = !!P.fps && fps !== P.fps;
  // frames taken at another frame rate, or of other footage, are wrong now --
  // on disk too, or the next look at the folder would take them back
  const stale = plan.cuts.filter(c => {
    const o = old.get(c.id);
    return o && !isBlank(c) && (refps || ((o.seqHave || []).length && !c.seqHave.length));
  }).map(c => ({ id: c.id, dir: c.seqDir }));
  P.cuts = plan.cuts;
  P.fps = fps;
  lastSync = plan.first ? null : { deleted: plan.deleted, added: plan.added };
  i = Math.max(0, Math.min(i, P.cuts.length - 1));
  markDirty(); renderAll();
  const kept = P.cuts.filter(c => !isBlank(c) && (c.pic || c.act || c.se)).length;
  return { total: info.cuts.length, kept, removed: plan.deleted.length, added: plan.added.length, stale };
}
async function dropStale(stale){
  if(!stale.length) return;
  let here = "";
  try{ here = (await followProject()).place.frames || ""; }catch(e){}
  for(const s of stale){
    for(const d of new Set([here, s.dir].filter(Boolean))){
      try{ await CEP.call("cntSeqClear", [d, s.id]); }catch(e){}
    }
    const n = P.cuts.findIndex(c => c.id === s.id);
    if(n >= 0){ P.cuts[n].seqHave = []; dropDecoded(n); }
  }
  markDirty(); showFrame(curFrame);
}

/* After a sync: what AE deleted and added. Doing nothing keeps the default,
   numbers close up. A deleted cut can keep its number as a blank; an added
   cut can take a suffix so the cuts after it keep theirs. */
function syncReport(){
  if(!lastSync || (!lastSync.deleted.length && !lastSync.added.length)) return;
  const draw = () => {
    const del = lastSync.deleted.map((d, k) => {
      const kept = P.cuts.some(c => c.id === d.blankId);
      return '<div class="row2 syncrow"><span class="mono">' + esc(d.no) + '</span><span>' + esc(d.name) + '</span>'
        + '<span class="grow"></span><button class="btn" data-del="' + k + '">' + (kept ? "取消空號" : "留空號") + '</button></div>';
    }).join("");
    const add = lastSync.added.map(id => {
      const c = P.cuts.find(x => x.id === id);
      if(!c) return "";
      return '<div class="row2 syncrow"><span class="mono">' + esc(c.no) + '</span><span>' + esc(c.aeName || "") + '</span>'
        + '<span class="grow"></span><button class="btn" data-add="' + esc(id) + '">'
        + (c.kind === "suffix" ? "改回獨立卡號" : "改成 " + esc(numberIf(c.id, true))) + '</button></div>';
    }).join("");
    $("modalBody").innerHTML =
        (lastSync.deleted.length ? '<div class="lab">AE 裡刪掉的卡（' + lastSync.deleted.length + '）</div>' + del : "")
      + (lastSync.added.length ? '<div class="lab">AE 裡新增的卡（' + lastSync.added.length + '）</div>' + add : "")
      + '<div class="row2" style="color:var(--mute)">不用按也可以：預設是後面的卡號自動遞補。之後也能點右側的卡號改成接在前一號後面，或在清單上方用＋插入空號、用－刪掉空號。</div>';
  };
  openModal("讀入結果", "", "完成", closeModal);
  draw();
  $("modalBody").onclick = e => {
    const b = e.target.closest && e.target.closest("button");
    if(!b) return;
    if(b.dataset.del != null) placeBlank(P.cuts, lastSync.deleted[Number(b.dataset.del)], lastSync.deleted);
    if(b.dataset.add != null) setSuffix(b.dataset.add, null);
    markDirty(); renderAll(); draw();
  };
}

/* the number cut `id` would get with or without its suffix, numbers after it unchanged */
function numberIf(id, on){
  const copy = P.cuts.map(x => Object.assign({}, x));
  const c = copy.find(x => x.id === id);
  if(on) c.kind = "suffix"; else delete c.kind;
  return renumber(copy).find(x => x.id === id).no;
}
function setSuffix(id, on){
  const c = P.cuts.find(x => x.id === id);
  if(!c || isBlank(c)) return;
  const want = on == null ? c.kind !== "suffix" : !!on;
  if(want) c.kind = "suffix"; else delete c.kind;
  renumber(P.cuts);
}

async function aeScan(withFrames){
  if(!inAE) return;
  const mode = aeMode();
  $("aeSync").disabled = true;
  try{
    const info = await CEP.call("cntScan", [mode]);
    aeInfo = info;
    useProject(info.project);
    renderSource();
    const r = mergeTiming(info);
    await dropStale(r.stale);
    P.aeComp = info.comp;          // the comp this board was read from; the CTI follows only that one
    const compFrames = Math.round(info.duration * info.fps);
    if(info.merged) console.log("[cento] merged", info.merged, "layers sharing a start time");
    if(mode === "layers-trim" && info.overlap > info.cuts.length * 0.5){
      toast("這個合成裡有 " + info.overlap + " 個圖層蓋過下一層的起點——圖層沒有裁切過，"
        + "「依圖層入點／出點」會把每一卡都算成一路到片尾。改用「依圖層（接到下一層）」。", true);
    }else if(frames() > compFrames * 1.5){
      toast("算出來的總長 " + tc(frames()) + " 比合成本身的 "
        + tc(compFrames) + " 長很多，切卡方式可能選錯了。", true);
    }else{
      toast("讀入 " + r.total + " 卡（合成全長 " + tc(compFrames) + "）"
        + (info.merged ? "，" + info.merged + " 個同時起始的圖層併成同一卡" : "")
        + (r.kept ? "，" + r.kept + " 卡沿用了原本的文字" : "") + "。");
    }
    if(withFrames) await pullFrames(mode);
    syncReport();
  }catch(err){
    toast(err.message, true);
  }finally{
    $("aeSync").disabled = false;
  }
}

async function pullFrames(mode){
  const dir = framesDirFor(aeInfo || {});
  if(!dir){ toast("找不到可以寫檔的資料夾。先把 AE 專案存檔再試。", true); return; }
  framesDir = dir;
  cancelSync = false;
  clearError();
  $("aeCancel").hidden = false; $("prog").classList.add("on");
  // blanks have no picture; a cut is addressed by its own frame in the comp
  const todo = [];
  P.cuts.forEach((c, k) => { if(!isBlank(c) && c.aeName && isFinite(c.aeAtF)) todo.push(k); });
  const n = todo.length;
  let done = 0, failed = 0;

  blobBust = Date.now();          // this run's files supersede anything cached
  try{ await CEP.call("cntBegin", [mode]); }catch(e){}
  try{
    for(let j = 0; j < n; j++){
      if(cancelSync) break;
      const k = todo[j], c = P.cuts[k];
      $("progTxt").textContent = "讀入畫面 " + (j + 1) + "／" + n;
      $("progBar").style.width = (j / n * 100) + "%";
      try{
        const r = await CEP.call("cntStill", [c.id, c.aeAtF, dir]);
        // captured from the composition, so it outranks the layer's own artwork
        c.media = { kind:"path", path:r.png, t:Date.now() };
        done++;
        if(k === i) renderStage();
        if(j % 5 === 4){ renderList(); renderStrip(); }
      }catch(err){
        failed++;
        // a stale picture is worse than none: it looks like the cut synced
        if(c.media && c.media.kind === "path" && !c.media.pinned) c.media = null;
        if(failed === 1) showError("讀入畫面失敗：" + err.message);
      }
    }
  }finally{
    try{ await CEP.call("cntEnd", []); }catch(e){}
    $("progBar").style.width = "100%";
    $("progTxt").textContent = "";
    $("prog").classList.remove("on");
    $("aeCancel").hidden = true;
  }

  markDirty(); renderAll();
  if(!cancelSync && !failed) clearError();
  toast(cancelSync ? ("已中止，讀入 " + done + " 張畫面。")
    : ("讀入 " + done + " 張畫面" + (failed ? "，" + failed + " 張失敗（其餘照常）。" : "。")));
}


/* ---------- local image import ---------- */
function downscale(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(max/im.width, max/im.height, 1), cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.width*s)); cv.height = Math.max(1, Math.round(im.height*s));
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg", 0.84));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("讀不到這個圖檔。")); };
    im.src = url;
  });
}
async function importFile(file){
  const c = P.cuts[i]; if(!c || !file) return;
  if(!file.type.startsWith("image/")) return toast("這裡只吃圖檔。影片長度請在 AE 裡按「讀入」取得。", true);
  try{
    c.media = { kind:"data", uri: await downscale(file, 1400), name: file.name, pinned:true };
    markDirty(); renderAll();
  }catch(err){ toast(err.message, true); }
}

/* ---------- filter ----------
 * One filter at a time: a status, "none" (not reviewed yet) or "notes". The
 * list and the timeline only bring forward the cuts that match, and ← → step
 * between them; the cut you are on never disappears, it is only dimmed. */
let filter = "";
function matches(c){
  if(!filter) return true;
  if(isBlank(c)) return false;
  if(filter === "notes") return !!(c.notes && c.notes.length);
  if(filter === "none") return !c.status;
  return c.status === filter;
}
const hits = () => P.cuts.map((c, n) => matches(c) ? n : -1).filter(n => n >= 0);
function setFilter(f){
  filter = (filter === f) ? "" : f;
  renderHead(); renderList(); renderStrip();
}
/* the next cut either way, among the matching ones when a filter is on */
function step(d){
  if(!P.cuts.length) return;
  pause();
  if(!filter) return select(i + d);
  const h = hits();
  if(!h.length) return toast("沒有符合的卡。");
  const N = P.cuts.length;
  for(let k = 1; k <= N; k++){
    const n = ((i + d * k) % N + N) % N;
    if(h.indexOf(n) >= 0) return select(n);
  }
}

/* ---------- render ---------- */
/* the segment a cell belongs to: a blank, or a cut added without a segment,
   sits in the segment of the cut before it, so it does not split the group */
function segAt(n){
  for(let k = n; k >= 0; k--){ const c = P.cuts[k]; if(c && c.seg) return c.seg; }
  return "";
}

function segGroups(){
  const g = [];
  P.cuts.forEach((c, n) => {
    const seg = segAt(n);
    if(!g.length || g[g.length-1].seg !== seg){
      const owner = P.cuts.find((x, k) => k <= n && x.seg === seg) || c;
      g.push({seg, segname: owner.segname, items:[]});
    }
    g[g.length-1].items.push(n);
  });
  return g;
}
const lenText = c => { const f = Math.max(1, c.frames|0), F = Math.round(fps()); return Math.floor(f / F) + "+" + (f % F); };

function renderList(){
  const box = $("rows"); box.textContent = "";
  for(const g of segGroups()){
    const shown = g.items;
    if(!shown.length) continue;
    if(g.seg){
      const h = document.createElement("div");
      h.className = "seghead";
      h.innerHTML = esc(g.seg) + '<span>' + esc(g.segname || "") + '</span>';
      box.appendChild(h);
    }
    for(const n of shown){
      const c = P.cuts[n], u = mediaURL(c.media);
      const r = document.createElement("div");
      r.className = "row" + (n === i ? " on" : "") + (matches(c) ? "" : " dim");
      r.draggable = true;
      if(isBlank(c)){
        r.className += " blank";
        r.innerHTML = '<div class="stat-dot"></div><div class="th"></div>'
          + '<div class="tx"><span class="nm">' + esc(c.no) + " · 空號</span>"
          + '<span class="fr">已刪除，保留號碼' + (c.wasName ? "（" + esc(c.wasName) + "）" : "") + '</span></div>'
          + '<span class="grip" title="拖曳可調整順序">⋮⋮</span>';
      }else{
        const mk = markCount(c), nn = (c.notes && c.notes.length) || 0;
        r.innerHTML = '<div class="stat-dot ' + esc(c.status || "") + '"></div>'
          + '<div class="th">' + imgTag(u) + '</div>'
          + '<div class="tx"><span class="nm">' + (c.kind === "suffix" ? "↳ " : "") + esc(c.no)
          + (c.aeName ? " · " + esc(c.aeName) : "") + '</span>'
          + '<span class="fr"><span class="mono">' + lenText(c) + '</span>'
          + (mk + nn ? ' · <span class="talk" title="批註 ' + mk + "、意見 " + nn + '">' + BUBBLE + (mk + nn) + "</span>" : "") + '</span></div>'
          + '<span class="grip" title="拖曳可調整順序">⋮⋮</span>';
        r.title = c.no + (c.kind === "suffix" ? "：接在前一號後面，後面的卡號不變" : "") + "　長度 " + lenText(c) + "（秒+格）";
      }
      r.addEventListener("click", () => { pause(); select(n); });
      r.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", String(n));
        e.dataTransfer.effectAllowed = "move"; r.classList.add("drag"); });
      r.addEventListener("dragend", () => r.classList.remove("drag"));
      r.addEventListener("dragover", e => { e.preventDefault(); r.classList.add("over"); });
      r.addEventListener("dragleave", () => r.classList.remove("over"));
      r.addEventListener("drop", e => { e.preventDefault(); r.classList.remove("over");
        const from = Number(e.dataTransfer.getData("text/plain"));
        if(Number.isInteger(from) && from !== n) move(from, n); });
      box.appendChild(r);
    }
  }
  renderRails();
}

/* The timeline: each cut as wide as it is long, the cut you are on widened so
 * its frames can be picked. Thin while the list is open; with the list folded
 * or in 專心看 it carries thumbnails and scene names (body.thumbs). */
const WIDE = 2.5, WIDE_MIN = 200;
const slotLen = c => isBlank(c) ? 0 : Math.max(1, c.frames|0);
const weight = n => n === i ? slotLen(P.cuts[n]) * WIDE : slotLen(P.cuts[n]);
function renderStrip(){
  const s = $("strip"); s.textContent = "";
  P.cuts.forEach((c, n) => {
    const u = mediaURL(c.media), b = document.createElement("div");
    b.className = "cut" + (n === i ? " on" : "") + (matches(c) || !filter ? "" : " dim")
      + (segAt(n) && n > 0 && segAt(n) !== segAt(n-1) ? " segstart" : "");
    if(isBlank(c)){
      b.className += " blank";
      b.title = c.no + "　空號";
    }else{
      b.style.flex = weight(n) + " 1 0";
      if(n === i) b.style.minWidth = WIDE_MIN + "px";
      const nn = ((c.notes && c.notes.length) || 0) + markCount(c);
      b.innerHTML = '<div class="im">' + imgTag(u) + '</div>'
        + '<div class="st ' + esc(c.status || "") + '"></div>'
        + '<span class="no">' + esc(c.no) + '</span>'
        + (nn ? '<span class="nt talk">' + BUBBLE + nn + '</span>' : "");
      b.title = c.no + "　" + lenText(c) + "　" + (c.status ? STATUS[c.status] : "未審") + (nn ? "　批註和意見 " + nn : "");
    }
    b.addEventListener("click", () => { pause(); select(n); });
    s.appendChild(b);
  });
  const sc = $("tlScenes"); sc.textContent = "";
  for(const g of segGroups()){
    const d = document.createElement("div");
    let w = 0, blanks = 0;
    g.items.forEach(n => { w += weight(n); if(isBlank(P.cuts[n])) blanks++; });
    d.style.flex = w + " 1 0";
    d.style.minWidth = (blanks * 24 + (g.items.indexOf(i) >= 0 ? WIDE_MIN : 0)) + "px";
    d.innerHTML = g.seg ? "<b>" + esc(g.seg) + "</b>" + esc(g.segname || "") : "";
    sc.appendChild(d);
  }
  renderFrameBar();
}
/* lay the frame picker and the playhead over the current cut's slot */
function placeFrames(){
  const cell = $("strip").children[i], tr = $("ftrack"), hd = $("tlHead");
  if(!cell || !P.cuts[i]){ hd.hidden = true; return; }
  const thumbs = document.body.classList.contains("thumbs");
  const h = thumbs ? 16 : cell.offsetHeight;
  tr.style.left = cell.offsetLeft + "px";
  tr.style.width = cell.offsetWidth + "px";
  tr.style.top = (cell.offsetTop + cell.offsetHeight - h) + "px";
  tr.style.height = h + "px";
  const c = P.cuts[i], L = Math.max(1, slotLen(c)), f = Math.min(L - 1, at());
  // a tick per frame, when they are far enough apart to see
  tr.style.backgroundImage = cell.offsetWidth / L >= 3
    ? "linear-gradient(to right, rgba(255,255,255,.28) 1px, transparent 1px)" : "none";
  tr.style.backgroundSize = (100 / L) + "% 100%";
  hd.hidden = false;
  hd.style.top = cell.offsetTop + "px";
  hd.style.height = cell.offsetHeight + "px";
  hd.style.left = (cell.offsetLeft + cell.offsetWidth * (isBlank(c) ? 0 : (f + .5) / L) - 1) + "px";
}
function renderTag(){
  const c = P.cuts[i];
  $("stagetag").innerHTML = !c ? "" : isBlank(c) ? "卡 " + esc(c.no) + " · 空號"
    : "卡 <b>" + esc(c.no) + "</b> · 第 <b>" + (at() + 1) + "</b> 格";
}
function renderStage(){
  renderTag();
  drawFrame();
  drawMarks();
}
function renderInspector(){
  const c = P.cuts[i], on = !!c;
  const edit = on && !isBlank(c);
  ["fSeg","fPic","fAct","fSe","noteText","noteAdd","whoName"].forEach(id => $(id).disabled = !edit);
  document.querySelectorAll(".statbar button").forEach(b => b.disabled = !edit);
  $("fNo").disabled = !edit;
  $("noPop").hidden = true;
  if(!on){
    $("fNo").textContent = "—"; $("cutMeta").textContent = "";
    ["fSeg","fPic","fAct","fSe"].forEach(id => $(id).value = "");
    $("noteList").innerHTML = '<div class="noteempty">還沒有卡</div>';
    renderRails();
    return;
  }
  $("fNo").textContent = (c.kind === "suffix" ? "↳ " : "") + (c.no || "");
  $("fNo").title = isBlank(c) ? "空號：已刪除，保留號碼" : "卡號照順序自動算。點一下可以改成接在前一號後面";
  $("fSeg").value = ((c.seg||"") + " " + (c.segname||"")).trim();
  $("fPic").value = c.pic || ""; $("fAct").value = c.act || ""; $("fSe").value = c.se || "";
  const from = c.aeAt;
  if(isBlank(c)){
    $("cutMeta").textContent = "空號" + (c.wasName ? "（原本是 " + c.wasName + "）" : "")
      + "。按清單上方的「－」刪掉，後面的卡號就會遞補。";
    $("cutMeta").title = "";
  }else{
    $("cutMeta").innerHTML = '長度 <span class="mono">' + lenText(c) + "</span> · " + fps() + " FPS";
    $("cutMeta").title = "長度與 FPS 以 AE 為準，讀入時更新"
      + ((from == null || !isFinite(from) || from < 0) ? "" : "\n取自合成 " + tc(Math.round(from * fps())) + (c.aeName ? "　" + c.aeName : ""))
      + (c.media && c.media.kind === "data" ? "\n畫面：匯入的圖檔 " + (c.media.name || "") : "");
  }
  document.querySelectorAll(".statbar button").forEach(b =>
    b.classList.toggle("on", b.dataset.s === (c.status || "")));
  renderNotes(c);
}
/* The notes of a cut, and its annotations as entries of their own, in the
   order they were made: a drawing on one frame is easy to miss on the
   timeline, so it shows here too -- a click goes there, and it can carry a
   line of text of its own. */
function renderNotes(c){
  const box = $("noteList");
  box.textContent = "";
  const n = P.cuts.indexOf(c);
  const notes = c.notes || [];
  const marks = markSpans(c).filter(sp => sp.m && sp.m.strokes && sp.m.strokes.length);
  // replies sit under what they answer: a note's id, or "m" + the frame of an annotation
  const parents = new Set(notes.map(x => x.id).concat(marks.map(sp => "m" + sp.f)));
  const kids = {};
  for(const x of notes) if(x.re && parents.has(x.re)) (kids[x.re] = kids[x.re] || []).push(x);
  const items = notes.filter(x => !x.re || !parents.has(x.re)).map(nt => ({ nt, at: nt.at || 0 }))
    .concat(marks.map(sp => ({ sp, at: sp.m.at || 0 })))
    .sort((a, b) => a.at - b.at);
  $("nNotes").textContent = notes.length + marks.length ? "(" + (notes.length + marks.length) + ")" : "";
  $("mTabN").textContent = notes.length + marks.length ? String(notes.length + marks.length) : "";
  if(!items.length && !isBlank(c)) box.innerHTML = '<div class="noteempty">這一卡還沒有意見</div>';
  const stampOf = at => {
    const when = new Date(at || Date.now());
    return when.toLocaleDateString() + " " +
      String(when.getHours()).padStart(2,"0") + ":" + String(when.getMinutes()).padStart(2,"0");
  };
  // in 網頁看片 only what you wrote can be deleted; others' come back from the host anyway
  const delBtn = (by, title) => (WEB && by !== myId()) ? "" : '<button class="del" title="' + title + '">✕</button>';
  const whoHtml = (who, by) => (by && people.list.some(p => p.id === by))
    ? '<button class="nwho" title="改這個名字">' + esc(who || "匿名") + '</button>'
    : '<b>' + esc(who || "匿名") + '</b>';
  const nameClick = (el, by) => {
    const w = el.querySelector(":scope > .meta .nwho");
    if(w) w.addEventListener("click", e => { e.stopPropagation(); openRename(by, e.currentTarget); });
  };
  const dropNote = id => {
    c.notes = (c.notes || []).filter(x => x.id !== id && x.re !== id);
    markDirty(); renderNotes(c); renderList(); renderStrip(); renderHead();
  };
  // the replies under one note or annotation, and the line to add one
  const thread = (d, key) => {
    const t = document.createElement("div");
    t.className = "replies";
    for(const r of (kids[key] || []).sort((a, b) => (a.at || 0) - (b.at || 0))){
      const e = document.createElement("div");
      e.className = "reply";
      e.innerHTML = '<div class="meta">' + whoHtml(r.who, r.by) + '<span>' + esc(stampOf(r.at))
        + '</span>' + delBtn(r.by, "刪除這則回覆") + '</div><p>' + esc(r.text) + '</p>';
      const rd = e.querySelector(".del"); if(rd) rd.addEventListener("click", () => dropNote(r.id));
      nameClick(e, r.by);
      t.appendChild(e);
    }
    const add = document.createElement("button");
    add.className = "reply-add";
    add.textContent = kids[key] ? "回覆" : "回覆…";
    add.addEventListener("click", () => replyBox(add, c, key));
    t.appendChild(add);
    d.appendChild(t);
  };
  for(const it of items){
    const d = document.createElement("div");
    if(it.nt){
      const nt = it.nt;
      d.className = "note";
      d.innerHTML = '<div class="meta">' + whoHtml(nt.who, nt.by) + '<span>' + esc(stampOf(nt.at))
        + '</span>' + delBtn(nt.by, "刪除這則" + (kids[nt.id] ? "和它的回覆" : "")) + '</div>'
        + (nt.re ? '<p class="orphan">↳ 回覆的意見已經刪除</p>' : "") + '<p>' + esc(nt.text) + '</p>';
      const nd = d.querySelector(".meta .del"); if(nd) nd.addEventListener("click", () => dropNote(nt.id));
      nameClick(d, nt.by);
      if(!nt.re) thread(d, nt.id);
    } else {

      d.className = "note mk";
      d.dataset.f = sp.f; d.dataset.end = end;
      d.innerHTML = '<div class="meta">' + whoHtml(sp.m.who, sp.m.by) + '<span>' + esc(stampOf(sp.m.at))

        + '<p class="mkline"><button class="mkgo" title="跳到這一格的批註">✎ ' + (sp.f + 1) + (end > sp.f ? "–" + (end + 1) : "") + 'f</button>'
        + (sp.m.text ? '<span class="mktext" title="點一下修改">' + esc(sp.m.text) + '</span>'
                     : '<button class="mkadd" title="替這個批註加文字說明">＋ 說明</button>') + '</p>';
      d.querySelector(".mkgo").addEventListener("click", () => {

      const edit = d.querySelector(".mktext, .mkadd");

/* a reply, written in place under what it answers */
function replyBox(btn, c, key){
  if(!myId()){ openWhoPop(false); return; }
  const t = document.createElement("input");
  t.className = "mkin"; t.placeholder = "回覆…（Enter 送出，Esc 取消）";
  btn.replaceWith(t);
  t.focus();
  let done = false;
  const finish = send => {
    if(done) return; done = true;
    const v = t.value.trim();
    if(send && v){
      if(!c.notes) c.notes = [];
      c.notes.push({ id: uid(), who: myName(), by: myId(), text: v, at: Date.now(), re: key });
      markDirty(); renderList(); renderStrip(); renderHead();
    }
    renderNotes(c);
  };
  t.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){ finish(true); e.preventDefault(); }

  });

}

  const t = document.createElement("input");
  t.className = "mkin"; t.value = sp.m.text || "";

    if(done) return; done = true;
    if(save){

        if(v) sp.m.text = v; else delete sp.m.text;

  t.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){ finish(true); e.preventDefault(); }
    else if(e.key === "Escape"){ finish(false); e.stopPropagation(); }

/* ---------- playback ---------- */
let playing = false, raf = null, t0 = 0, elapsedFrames = 0;
function tick(){
  if(!playing) return;
  const c = P.cuts[i]; if(!c){ pause(); return; }
  elapsedFrames = CLOUD && CC.playing() ? CC.now() - vStart(i) : Math.floor((performance.now() - t0)/1000*fps());
  if(CLOUD) drawFrame();
  const len = isBlank(c) ? 0 : Math.max(1, c.frames|0);
  if(elapsedFrames >= len){
    if(i === P.cuts.length-1){ elapsedFrames = len; pause(); renderBar(); return; }
    select(i+1);
  }else if(!CLOUD && (c.seqHave || []).length){
    // a cached cut plays its frames, and the next cut's first ones get ready
    if(elapsedFrames !== curFrame) playFrame(elapsedFrames);
    const left = len - elapsedFrames;
    if(left <= SEQ_AHEAD && i + 1 < P.cuts.length)
      for(let d = 0; d <= SEQ_AHEAD - left; d++) loadSeqFrame(i + 1, d);
  }else renderBar();
  raf = requestAnimationFrame(tick);
}
function play(){ if(!P.cuts.length) return;
  seqPause();
  playing = true; $("play").innerHTML = ICON.pauseAll;
  t0 = performance.now() - elapsedFrames/fps()*1000;
  if(CLOUD) CC.play(vStart(i) + elapsedFrames);
  raf = requestAnimationFrame(tick); }
function pause(){
  if(!playing) return;
  playing = false; $("play").innerHTML = ICON.playAll;
  cancelAnimationFrame(raf);
  if(CLOUD) CC.pause();
  curFrame = Math.min(elapsedFrames, Math.max(0, slotLen(P.cuts[i]) - 1));   // stop on the frame you were seeing
  showFrame(curFrame);
}

      + '<div class="ln">這一卡重新佔一個卡號，後面的卡號往後推一號。</div>'
    : (i === 0 || /^0+$/.test(prev)
      ? '<div class="hd">第一卡前面沒有卡號可以接。</div>'
      : isBlank(before) ? '<div class="hd">前一號是空號，不能接在它後面。</div>'
      : '<button data-sfx="1"><span class="ck"></span>改成 ' + esc(to) + '（接在 ' + esc(prev) + ' 後面，後面的卡號不變）</button>');
  togglePop("noPop");
});
$("noPop").addEventListener("click", e => {
  const b = e.target.closest("button[data-sfx]"); if(!b) return;
  setSuffix(P.cuts[i].id, b.dataset.sfx === "1");
  closePops(); markDirty(); renderAll();
});

/* ---------- folding panels and 專心看 ---------- */
const UI_LS = "cento.ui";
let ui = null;
try{ ui = JSON.parse(localStorage.getItem(UI_LS) || "null"); }catch(e){}
if(!ui || typeof ui !== "object") ui = { list: window.innerWidth > 1080, insp: true };
let imm = false, immT = 0;
function applyPanels(){
  const b = document.body.classList;
  b.toggle("lc", !ui.list);
  b.toggle("rc", !ui.insp);
  b.toggle("imm", imm);
  b.toggle("thumbs", imm || !ui.list);
  $("immBtn").title = imm ? "離開專心看（F 或 Esc）" : "專心看：只留畫面、播放列和時間軸（F）";
  $("immBtn").setAttribute("aria-label", imm ? "離開專心看" : "專心看");
  $("immBtn").classList.toggle("on", imm);
}
function saveUi(){ try{ localStorage.setItem(UI_LS, JSON.stringify(ui)); }catch(e){} }
function setPanel(side, open){ ui[side] = open; saveUi(); applyPanels(); }
function setImm(on){
  imm = on;
  if(on) setPen(false);
  applyPanels();
  clearTimeout(immT);
  $("immHint").classList.toggle("show", on);
  if(on) immT = setTimeout(() => $("immHint").classList.remove("show"), 2000);
}
$("listFold").addEventListener("click", () => setPanel("list", false));
$("listRail").addEventListener("click", () => setPanel("list", true));
$("inspFold").addEventListener("click", () => setPanel("insp", false));
$("inspRail").addEventListener("click", () => setPanel("insp", true));
$("immBtn").addEventListener("click", () => setImm(!imm));
document.body.classList.add("still");            // no slide on the first paint
if(window.innerWidth <= 1080) ui.list = false;   // a narrow panel opens with the list folded (not saved)
applyPanels();
setTimeout(() => document.body.classList.remove("still"), 60);

/* the picture and the timeline size themselves from their boxes, which change
   when a panel folds, not only when the window does */
let relayRaf = 0;
function relayout(){
  cancelAnimationFrame(relayRaf);
  relayRaf = requestAnimationFrame(() => { if(!P) return; drawFrame(); drawMarks(); placeFrames(); });
}
addEventListener("resize", relayout);
if(window.ResizeObserver){ new ResizeObserver(relayout).observe($("stage")); new ResizeObserver(relayout).observe($("strip")); }

/* ---------- AE's time indicator follows the board ----------
 * Picking a cut, or a frame in it, moves the CTI of the comp the board was
 * read from to that frame; ⋯ turns it off. Only the CTI moves. While anything
 * plays or captures it waits, and follows once it stops. */
let ctiT = 0, ctiWarned = false;
function followCTI(){
  if(!inAE || ui.cti === false || playing || seqPlaying || grabbing || exporting) return;
  clearTimeout(ctiT);
  ctiT = setTimeout(async () => {
    const c = P.cuts[i];
    if(!c || isBlank(c) || !isFinite(c.aeInF)) return;
    // a board never read in this version does not know its comp: leave AE alone
    const comp = (aeInfo && aeInfo.comp) || P.aeComp;
    if(!comp) return;
    try{
      const r = await CEP.call("cntGoto", [c.aeInF + curFrame, comp]);
      if(r.moved === false && !ctiWarned){
        ctiWarned = true;
        toast("AE 現在開的是「" + r.comp + "」，不是讀入的合成，所以沒有同步。");
      }
    }catch(e){}
  }, 120);
}
$("ctiBtn").addEventListener("click", () => {
  ui.cti = ui.cti === false; saveUi();
  toast(ui.cti === false ? "AE 時間軸同步：關" : "AE 時間軸同步：開");
  followCTI();
});

/* ---------- filter chips and stepping ---------- */
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if(b) setFilter(b.dataset.f);
});

/* ---------- shortcuts ---------- */
const KEYS = [
  ["← →", "換卡（篩選中只在符合的卡之間換）"], [", .", "上一格／下一格"],
  ["Enter", "播放這一卡"], ["空白鍵", "播放全片"], ["Home End", "第一卡／最後一卡"],
  ["P", "批註工具"], ["Ctrl+Z", "復原一筆批註"], ["F", "專心看"], ["Esc", "離開專心看、收起批註工具"],
  ["[ ]", "收起／展開清單、審閱欄"], ["Ctrl+Enter", "送出意見"], ["Ctrl+S", "立刻存檔"], ["?", "這一頁"]
];
function showKeys(){
  openModal("快捷鍵", '<div class="keys">' + KEYS.map(k =>
    "<span>" + k[0].split(" ").map(x => "<kbd>" + esc(x) + "</kbd>").join(" ") + "</span><span>" + esc(k[1]) + "</span>").join("")
    + "</div>", "", null);
}
/* What is new in this version, shown in 關於 CENTO. */
const NEWS = [
  "清單、審閱欄可收起；按 F 專心看",
  "批註：4 種顏色、3 種粗細、橡皮擦、Ctrl+Z 復原",

  "審片結果：通過／重修／保留"
];
function showAbout(){
  openModal("關於 CENTO", '<div class="row2">版本 <b class="mono">' + esc(VERSION) + (DEMO ? " demo" : "") + "</b></div>"
    + '<div class="row2">在 After Effects 裡看分鏡、審片、畫批註、輸出影片。</div>'
    + '<div class="lab">這一版的更新</div>'
    + NEWS.map(t => '<div class="row2">・' + esc(t) + "</div>").join(""), "", null);

/* 回報問題: the form opens in the browser, and what the form asks about this
 * computer goes to the clipboard for the user to paste. Nothing is sent from
 * here: the panel never talks to the network on its own. */
const FEEDBACK_URL = "https://forms.gle/M2zJ1emx3J9fPmCz8";
let aeVersion = "";
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  const t = document.createElement("textarea");
  t.value = text; t.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(t); t.select();
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  t.remove();
  return ok;
}
async function reportProblem(){
  const info = "CENTO " + VERSION + (DEMO ? " demo" : "")
    + "　After Effects " + (aeVersion || "（不明）")
    + "　" + ((window.CEP && CEP.osName && CEP.osName()) || navigator.platform || "");
  const copied = await copyText(info);
  CEP.openURL(FEEDBACK_URL);
  if(copied) toast("已複製版本資訊，請貼到表單裡：" + info);
  else openModal("回報問題", '<div class="row2">請把下面這行貼到表單裡：</div><div class="row2 mono">' + esc(info)
    + '</div><div class="row2">表單：' + esc(FEEDBACK_URL) + "</div>", "", null);
}

/* Dragging the grip on an annotation's right end sets how long it holds;
 * shift-clicking a frame does the same in one gesture. Pressing anywhere else
 * on the frames picks a frame, and dragging scrubs. */
let spanDrag = null, scrub = false;
const trackFrame = ev => {
  const r = $("ftrack").getBoundingClientRect();
  const n = cutFrames(P.cuts[i]);
  if(!(r.width > 0)) return curFrame;      // panel too narrow to have a track
  return Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - r.left) / r.width * n)));
};
$("ftrack").addEventListener("pointerdown", e => {
  if(e.button !== undefined && e.button !== 0) return;
  pause(); seqPause();
  const g = e.target.closest && e.target.closest(".grip");
  $("ftrack").setPointerCapture && $("ftrack").setPointerCapture(e.pointerId);
  e.preventDefault(); e.stopPropagation();
  if(g){ spanDrag = Number(g.parentNode.dataset.f); return; }
  const f = trackFrame(e);
  if(e.shiftKey && holdTo(f)) return;
  scrub = true;
  showFrame(f);
});
$("ftrack").addEventListener("pointermove", e => {
  if(scrub){ const f = trackFrame(e); if(f !== curFrame) showFrame(f); return; }
  if(spanDrag === null) return;
  const c = P.cuts[i], m = c && c.marks && c.marks[String(spanDrag)];
  if(!m) return;
  m.hold = Math.max(0, trackFrame(e) - spanDrag);
  renderFrameBar(); drawMarks();
});
const endSpanDrag = () => {
  scrub = false;
  if(spanDrag === null) return;
  spanDrag = null;
  markDirty(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
};
$("ftrack").addEventListener("pointerup", endSpanDrag);
$("ftrack").addEventListener("pointercancel", endSpanDrag);
$("ftrack").addEventListener("click", e => e.stopPropagation());

const dcv = $("drawCv");
dcv.addEventListener("pointerdown", beginStroke);
dcv.addEventListener("pointermove", extendStroke);
dcv.addEventListener("pointerup", endStroke);
dcv.addEventListener("pointercancel", endStroke);
dcv.addEventListener("pointerleave", endStroke);

$("noteText").addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ addNote(); e.preventDefault(); }
});
$("whoName").addEventListener("click", e => { e.stopPropagation(); $("whoPop").hidden ? openWhoPop(false) : closeWho(); });
$("whoPop").addEventListener("click", e => {
  e.stopPropagation();
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.act === "rename"){ closeWho(); openRename(myId(), $("whoName")); }
  else if(b.dataset.pid) usePerson(b.dataset.pid);
  else if(b.dataset.name) pickName(b.dataset.name);
  else if(b.id === "whoOk") pickName($("whoNew").value);
});
$("whoPop").addEventListener("keydown", e => {
  if(e.target.id !== "whoNew") return;
  if(e.key === "Enter"){ pickName($("whoNew").value); e.preventDefault(); }
  else if(e.key === "Escape"){ closeWho(); e.stopPropagation(); }
});
$("renamePop").addEventListener("click", e => e.stopPropagation());
document.querySelectorAll(".statbar button").forEach(b =>
  b.addEventListener("click", () => setStatus(b.dataset.s)));

const sw = $("stagewrap");
["dragenter","dragover"].forEach(ev => sw.addEventListener(ev, e => {
  e.preventDefault(); sw.classList.add("dz"); $("dzhint").hidden = false; }));
["dragleave","drop"].forEach(ev => sw.addEventListener(ev, e => {
  if(ev === "dragleave" && sw.contains(e.relatedTarget)) return;
  sw.classList.remove("dz"); $("dzhint").hidden = true; }));
sw.addEventListener("drop", e => { e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) importFile(f); });

$("play").addEventListener("click", () => { seqPause(); playing ? pause() : play(); });
$("bannerClose").addEventListener("click", () => { $("banner").hidden = true; });
$("bannerMore").addEventListener("click", () => {
  const b = $("banner");
  b.classList.toggle("open");
  $("bannerMore").textContent = b.classList.contains("open") ? "收合" : "展開";
});
$("bannerCopy").addEventListener("click", async () => {
  const text = $("bannerMsg").textContent;
  try{
    await navigator.clipboard.writeText(text);
    toast("已複製到剪貼簿。");
  }catch(e){
    const r = document.createRange();
    r.selectNodeContents($("bannerMsg"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("已選取訊息，按 Ctrl+C 複製。");
  }
});

addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); save(); return; }
  if(typing) return;
  if(!$("modal").hidden){ if(e.key === "Escape") closeModal(); return; }
  const plain = !e.ctrlKey && !e.metaKey && !e.altKey;
  if(e.key === "," || e.key === "<"){ pause(); seqPause(); showFrame(curFrame - 1); e.preventDefault(); }
  else if(e.key === "." || e.key === ">"){ pause(); seqPause(); showFrame(curFrame + 1); e.preventDefault(); }
  else if(e.key === "Enter"){ pause(); seqPlaying ? seqPause() : seqPlay(); e.preventDefault(); }
  else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ undoStroke(); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ step(-1); e.preventDefault(); }
  else if(e.key === "ArrowRight"){ step(1); e.preventDefault(); }
  else if(e.key === " "){ seqPause(); playing ? pause() : play(); e.preventDefault(); }
  else if(e.key === "Home"){ pause(); select(0); }
  else if(e.key === "End"){ pause(); select(P.cuts.length-1); }
  else if(!plain) return;
  else if(e.key === "f" || e.key === "F"){ setImm(!imm); e.preventDefault(); }
  else if(e.key === "p" || e.key === "P"){ if(!imm) setPen(!penOn); e.preventDefault(); }
  else if(e.key === "["){ setPanel("list", !ui.list); e.preventDefault(); }
  else if(e.key === "]"){ setPanel("insp", !ui.insp); e.preventDefault(); }
  else if(e.key === "?"){ showKeys(); e.preventDefault(); }
  else if(e.key === "Escape"){
    if(pops.some(id => !$(id).hidden)) closePops();
    else if(imm) setImm(false);
    else if(penOn) setPen(false);
  }
});

addEventListener("beforeunload", () => { if(dirty) save(); });

boot();
