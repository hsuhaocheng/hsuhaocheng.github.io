<script src="config.js"></script>
<script src="lib/cloud-view.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const LS = "cento.board.v1";
const inAE = !!(window.CEP && CEP.available());
// 網頁看片: this panel was opened in a browser from the computer running AE
// (lib/web-cep.js stands in for CEP and brings the board; lib/web-client.js keeps it in step).
// 雲端看片 (CLOUD) is the same, opened from a link: the board and the film come
// from the Google Sheet and the video the host shared (lib/cloud-view.js)
const CLOUD = !!(window.CENTO_WEB && window.CENTO_WEB.cloud);
const WEB = !!(window.CENTO_WEB && (window.CENTO_WEB.state || CLOUD));
const CC = CLOUD ? window.CENTO_WEB.cloud : null;
const VERSION = "1.2.0";   // keep in step with CSXS/manifest.xml (tools/lint_panel.py checks)
// Demo builds. tools/build_release.py rewrites these two lines in the copy it
// packs; the source is always the full build.
const DEMO = false;
const DEMO_UNTIL = "";      // last day a demo may export, YYYY-MM-DD
const DEMO_MARK = "";       // the watermark picture as a data: URL (a file would taint the canvas)
let demoMark = null;
const demoMarkReady = (DEMO && DEMO_MARK) ? (() => {
  const im = new Image();
  im.src = DEMO_MARK;
  return im.decode().then(() => { demoMark = im; }).catch(() => {});
})() : Promise.resolve();
function today(){
  const d = new Date(), z = n => (n < 10 ? "0" : "") + n;
  return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
}
function demoDaysLeft(){
  if(!DEMO || !DEMO_UNTIL) return Infinity;
  return Math.floor((new Date(DEMO_UNTIL + "T23:59:59") - new Date()) / 86400000);
}
// once a demo runs out only exporting stops: the board, the notes and the
// marks are the tester's own work and stay readable
const demoExpired = () => DEMO && !!DEMO_UNTIL && today() > DEMO_UNTIL;
$("build").textContent = "v" + VERSION + (DEMO ? " demo" : "");
if(DEMO && DEMO_UNTIL) $("build").title = "測試版，可輸出到 " + DEMO_UNTIL;
if(DEMO) setTimeout(() => {
  const left = demoDaysLeft();
  if(demoExpired()) toast("測試版已到期：看板仍可檢視，但無法輸出影片。", true);
  else if(left <= 14) toast("測試版還可以輸出 " + (left + 1) + " 天（到 " + DEMO_UNTIL + "）。");
}, 1500);
const baseName = p => String(p || "").replace(/\\/g, "/").split("/").pop().replace(/\.[^.]*$/, "");
function setTitle(projectPath){
  $("brand").textContent = baseName(projectPath) || "CENTO";
}
console.log("[cento] version", VERSION);

let P = null, i = 0, dirty = false;
let savePath = null, framesDir = null, aeInfo = null, cancelSync = false;
let blobBust = Date.now();   // bumped whenever cached frame files may be stale

const uid = () => Math.random().toString(36).slice(2, 9);
const STATUS = { ok: "通過", fix: "重修", talk: "保留" };   // stored values stay ok/fix/talk
/* how a comp is split into cuts; the value is what the host script takes */
const MODES = [["layers", "依圖層（接到下一層）"], ["layers-trim", "依圖層入點／出點"], ["markers", "依合成標記"]];
const aeMode = () => (P && MODES.some(m => m[0] === P.aeMode)) ? P.aeMode : "layers";
/* A path that no longer exists would otherwise render as a broken-image icon
   across the whole strip. Drop the element instead. */
function imgTag(url, alt){
  return url ? '<img src="' + esc(url) + '" alt="' + esc(alt || "") +
    '" onerror="this.remove()">' : "";
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function seedProject(){
  // a new board starts empty: its cuts come from After Effects on 同步
  return { v:FORMAT, title:"", fps:24, who:"", cuts: [] };
}


/* ================= frame player and annotation =================
 *
 * The board's per-cut picture is the middle frame, which is enough to read the
 * film but not enough to say "fix frame 47". So a cut can also hold the whole
 * sequence of its frames, captured on demand, and every frame can carry
 * freehand marks.
 *
 * Frames are drawn to a canvas rather than swapped as <img>: an <img> swap
 * costs a layout and cannot be scheduled against the display, which shows up as
 * stutter at 24fps. Decoded frames are kept as ImageBitmaps in a small ring
 * buffer around the playhead -- decoding is the expensive part, and a whole cut
 * of decoded bitmaps would not fit in memory.
 *
 * Strokes are stored in 0..1 coordinates so they stay put whatever size the
 * panel is, and survive a re-capture at another resolution.
 */
const SEQ_AHEAD = 10;      // frames to keep decoded either side of the playhead
const SEQ_CACHE = 72;      // hard cap on decoded frames held at once

const pad4 = n => ("0000" + n).slice(-4);

let curFrame = 0;                 // frame offset inside the selected cut
let seqCache = new Map();         // "cut:frame" -> ImageBitmap
let seqPending = new Map();       // "cut:frame" -> Promise
let seqPlaying = false, seqRaf = null, seqT0 = 0, seqStartFrame = 0;
let grabbing = false, cancelGrab = false;

const seqKey = (cut, f) => ((P.cuts[cut] && P.cuts[cut].id) || ("#" + cut)) + ":" + f;   // by cut id: positions move
const cutFrames = c => Math.max(1, (c && c.frames | 0) || 1);

function seqPathFor(cutIndex, frame){
  const c = P.cuts[cutIndex];
  if(WEB) return c ? "/frame?cut=" + encodeURIComponent(c.id) + "&f=" + frame : null;   // from the host
  if(!c || !c.seqDir) return null;
  return c.seqDir + "/cnt_" + c.id + "_" + pad4(frame) + ".png";
}
function hasSeqFrame(cutIndex, frame){
  const c = P.cuts[cutIndex];
  return !!(c && c.seqHave && c.seqHave.indexOf(frame) >= 0);
}

/* where frames are being looked at: the panel's playhead, or the export's
   write head while an export is running */
let seqAnchor = null;
function evictSeq(){
  if(seqCache.size <= SEQ_CACHE) return;
  const ac = seqKey(seqAnchor ? seqAnchor.cut : i, 0).split(":")[0];
  const af = seqAnchor ? seqAnchor.frame : curFrame;
  const an = seqAnchor ? seqAnchor.cut : i;
  const nx = P.cuts[an + 1] ? seqKey(an + 1, 0).split(":")[0] : null;
  const left = cutFrames(P.cuts[an]) - af;
  // drop whatever is furthest from where we are looking; another cut is far,
  // except the start of the next one, which playing runs into
  const dist = k => {
    const parts = k.split(":"), f = Number(parts[1]);
    if(parts[0] === ac) return Math.abs(f - af);
    if(parts[0] === nx) return left + f;
    return 1e6 + f;
  };
  const keep = [...seqCache.keys()].sort((a, b) => dist(a) - dist(b));
  for(const k of keep.slice(SEQ_CACHE)){
    const bmp = seqCache.get(k);
    if(bmp && bmp.close) bmp.close();
    seqCache.delete(k);
  }
}

function loadSeqFrame(cutIndex, frame){
  const key = seqKey(cutIndex, frame);
  if(seqCache.has(key)) return Promise.resolve(seqCache.get(key));
  if(seqPending.has(key)) return seqPending.get(key);
  const path = seqPathFor(cutIndex, frame);
  if(!path || !(inAE || WEB) || !hasSeqFrame(cutIndex, frame)) return Promise.resolve(null);

  const job = (async () => {
    try{
      const im = new Image();
      im.src = CEP.fileURL(path);
      await im.decode();
      const bmp = (typeof createImageBitmap === "function")
        ? await createImageBitmap(im) : im;
      seqCache.set(key, bmp);
      evictSeq();
      return bmp;
    }catch(err){
      return null;
    }finally{
      seqPending.delete(key);
    }
  })();
  seqPending.set(key, job);
  return job;
}

/* Keep the frames around the playhead decoded, so stepping and playback do not
   wait on a decode. Fire and forget. */
function prefetchSeq(cutIndex, frame){
  const c = P.cuts[cutIndex];
  if(!c || !c.seqHave || !c.seqHave.length) return;
  const last = cutFrames(c) - 1;
  for(let d = 1; d <= SEQ_AHEAD; d++){
    if(frame + d <= last) loadSeqFrame(cutIndex, frame + d);
    if(frame - d >= 0)    loadSeqFrame(cutIndex, frame - d);
  }
}

/* ---------- the two canvases ---------- */
function fitCanvas(cv){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  return { w, h };
}

/* Where the picture actually sits inside the canvas, so marks land on the
   picture and not on the letterboxing. */
let picBox = { x:0, y:0, w:1, h:1 };

function drawFrame(){
  const cv = $("frameCv"), cx = cv.getContext("2d");
  const { w, h } = fitCanvas(cv);
  cx.clearRect(0, 0, w, h);

  const c = P.cuts[i];
  let src = null;
  if(c && hasSeqFrame(i, curFrame)) src = seqCache.get(seqKey(i, curFrame)) || null;
  if(CLOUD && c && !isBlank(c)) src = CC.frame(vStart(i) + curFrame) || src;   // the film, once it is in
  if(!src) src = stillFor(c);

  if(!src){ picBox = { x:0, y:0, w, h }; emptyNote(c); $("empty").hidden = false; return; }
  $("empty").hidden = true;

  const iw = src.videoWidth || src.width || src.naturalWidth, ih = src.videoHeight || src.height || src.naturalHeight;   // a <video>'s width is its attribute
  const s = Math.min(w / iw, h / ih);
  const dw = Math.round(iw * s), dh = Math.round(ih * s);
  const dx = Math.round((w - dw) / 2), dy = Math.round((h - dh) / 2);
  picBox = { x:dx, y:dy, w:dw, h:dh };
  cx.drawImage(src, dx, dy, dw, dh);
}

/* what the empty picture says: the first steps on an empty board, else why
   this cut has no picture */
function emptyNote(c){
  const html = !P.cuts.length
    ? '<div class="steps"><b>開始</b><span>① 在 AE 開啟要看的合成</span><span>② 按「讀入」</span><button class="btn pri" id="emptyGo"><span class="ic">⟳</span> 讀入</button></div>'
    : isBlank(c) ? "空號：這一卡已刪除，保留號碼"
    : WEB ? "畫面載入中…（如果一直沒出現，表示開著 AE 的那台還沒有這一卡的畫面）"
    : "這一卡還沒有畫面。按「讀入」從 AE 讀入，或把圖檔拖進來";
  if($("empty").innerHTML !== html) $("empty").innerHTML = html;
}

/* the cut's single picture, kept decoded so the canvas has something to show
   before any sequence exists */
const stillCache = new Map();
function stillFor(c){
  if(!c || !c.media) return null;
  const url = mediaURL(c.media);
  if(!url) return null;
  if(stillCache.has(url)) return stillCache.get(url) || null;
  const im = new Image();
  im.onload = () => { stillCache.set(url, im); drawFrame(); drawMarks(); };
  im.onerror = () => { stillCache.set(url, null); };
  im.src = url;
  stillCache.set(url, null);          // pending; redrawn on load
  return null;
}

function loadStill(c){
  const url = (c && c.media) ? mediaURL(c.media) : null;
  if(!url) return Promise.resolve(null);
  const have = stillCache.get(url);
  if(have) return Promise.resolve(have);
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { stillCache.set(url, im); res(im); };
    im.onerror = () => { stillCache.set(url, null); res(null); };
    im.src = url;
  });
}

/* A mark is keyed by the frame it was drawn on and carries `hold`, the number
 * of further frames it stays up for. hold 0 -- and a mark with no hold at all,
 * which is every mark made before this existed -- means that one frame only. */
function markSpans(c){
  if(!c || !c.marks) return [];
  return Object.keys(c.marks)
    .map(k => ({ f: Number(k), m: c.marks[k] }))
    .filter(x => isFinite(x.f))
    .sort((a, b) => a.f - b.f);
}
function spanEnd(sp){ return sp.f + Math.max(0, sp.m.hold | 0); }
function marksOf(c, frame){
  return markSpans(c).filter(sp => frame >= sp.f && frame <= spanEnd(sp)).map(sp => sp.m);
}
/* the mark the edit buttons act on: the one that starts here, else the one
   holding over this frame -- so undo still works while parked mid-hold */
function editableMark(){
  const c = P.cuts[i];
  if(!c || !c.marks) return null;
  const here = c.marks[String(curFrame)];
  if(here) return { k: String(curFrame), m: here };
  const sp = markSpans(c).filter(x => curFrame >= x.f && curFrame <= spanEnd(x)).pop();
  return sp ? { k: String(sp.f), m: sp.m } : null;
}

/* Pens. A mark's strokes can carry a parallel list `styles`, one
 * { c: colour name, w: size 1-3 } per stroke. A stroke without one -- every
 * stroke drawn before 1.2.0 -- is red at size 1, which is how it always looked. */
const PEN_COLORS = { red: "#E1503C", yellow: "#F2C14E", blue: "#4EA8F2", white: "#FFFFFF" };
const PEN_NAMES = { red: "紅", yellow: "黃", blue: "藍", white: "白" };
const PEN_SIZES = { 1: 1, 2: 2, 3: 4 };       // times the base line width
const styleOf = (m, k) => {
  const s = (m.styles && m.styles[k]) || {};
  return { c: PEN_COLORS[s.c] ? s.c : "red", w: PEN_SIZES[s.w] ? s.w : 1 };
};
const lineBase = box => Math.max(2, Math.round(box.w * 0.004));
/* styles as long as strokes, so the two can be edited together */
function ensureStyles(m){
  if(!Array.isArray(m.styles)) m.styles = [];
  m.styles.length = Math.min(m.styles.length, m.strokes.length);
  for(let k = 0; k < m.strokes.length; k++) m.styles[k] = styleOf(m, k);
  return m;
}
function paintMarks(cx, list, box){
  cx.lineCap = "round"; cx.lineJoin = "round";
  for(const m of list){
    if(!m || !m.strokes) continue;
    m.strokes.forEach((st, k) => {
      if(!st || st.length < 4) return;
      const s = styleOf(m, k);
      cx.strokeStyle = PEN_COLORS[s.c];
      cx.lineWidth = lineBase(box) * PEN_SIZES[s.w];
      cx.beginPath();
      cx.moveTo(box.x + st[0] * box.w, box.y + st[1] * box.h);
      for(let j = 2; j < st.length; j += 2) cx.lineTo(box.x + st[j] * box.w, box.y + st[j+1] * box.h);
      cx.stroke();
    });
  }
}
function drawMarks(){
  const cv = $("drawCv"), cx = cv.getContext("2d");
  const { w, h } = fitCanvas(cv);
  cx.clearRect(0, 0, w, h);
  paintMarks(cx, marksOf(P.cuts[i], curFrame), picBox);
}

/* The frames of the cut you are on sit over its slot in the timeline (#ftrack):
 * the frame you are on, and each annotation as a bar from its own frame to the
 * end of its hold. Frame f covers [f/n, (f+1)/n) of the slot. */
function renderFrameBar(){
  const c = P.cuts[i];
  const n = cutFrames(c);
  const have = (c && c.seqHave) ? c.seqHave.length : 0;
  const st = $("seqstate");
  // the cut and frame are on the transport already; here only what is still missing
  if(!grabbing) st.textContent = have && have < n ? "已快取 " + have + "／" + n + " 格" : "";
  st.classList.toggle("on", have === n && n > 1);
  $("grabSeq").hidden = !c || isBlank(c) || (have === n && !grabbing);

  const tr = $("ftrack");
  tr.textContent = "";
  tr.hidden = !c || isBlank(c);
  if(tr.hidden) return;
  const pct = f => f / n * 100;
  const cur = document.createElement("div");
  cur.className = "fcur";
  cur.style.left = pct(curFrame) + "%"; cur.style.width = pct(1) + "%";
  tr.appendChild(cur);
  for(const sp of markSpans(c)){
    if(sp.f < 0 || sp.f >= n) continue;
    const end = Math.min(n - 1, spanEnd(sp));
    const d = document.createElement("div");
    d.className = "fspan" + (curFrame >= sp.f && curFrame <= end ? " on" : "");
    d.style.left = pct(sp.f) + "%";
    d.style.width = pct(end + 1 - sp.f) + "%";
    d.dataset.f = String(sp.f);
    d.innerHTML = '<span class="grip" title="批註：第 ' + (sp.f + 1) + (end > sp.f ? "–" + (end + 1) : "")
      + ' 格。拖右端可延長顯示格數（Shift＋點也可以）"></span>';
    tr.appendChild(d);
  }
  placeFrames();
}

function showFrame(f){
  const c = P.cuts[i];
  const n = cutFrames(c);
  curFrame = Math.max(0, Math.min(n - 1, f | 0));
  const key = seqKey(i, curFrame);
  if(hasSeqFrame(i, curFrame) && !seqCache.has(key)){
    loadSeqFrame(i, curFrame).then(() => { drawFrame(); drawMarks(); });
  }
  drawFrame(); drawMarks(); renderFrameBar(); renderBar(); hiliteMarkNotes();
  prefetchSeq(i, curFrame);
  followCTI();
}

/* ---------- playback inside a cut ---------- */
/* how much was said on a cut -- annotations, notes and replies together */
const BUBBLE = '<svg class="bub" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2.5h9.5a1 1 0 0 1 1 1v5.5a1 1 0 0 1-1 1H6.5L3.5 12.3V10H2a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1z"/></svg>';

/* the transport, drawn rather than written: ◀| a frame back, ▶ this cut,
   |▶ a frame on, and ▶ over a long line -- the whole timeline -- for the film from here */
const ICON = (() => {
  const svg = (box, body) => '<svg viewBox="' + box + '" aria-hidden="true">' + body + "</svg>";
  const line = '<rect x="0.5" y="10.2" width="11" height="1.8"/>';
  // all in a 12 x 12 box: the same triangle, bars 1.8 wide
  return {
    back: svg("0 0 12 12", '<rect x="9.7" y="1.5" width="1.8" height="9"/><path d="M8.6 1.5v9L2 6z"/>'),
    next: svg("0 0 12 12", '<rect x="0.5" y="1.5" width="1.8" height="9"/><path d="M3.4 1.5v9L10 6z"/>'),
    play: svg("0 0 12 12", '<path d="M3 1.5v9L10.5 6z"/>'),
    pause: svg("0 0 12 12", '<rect x="2.2" y="1.5" width="2.6" height="9"/><rect x="7.2" y="1.5" width="2.6" height="9"/>'),
    playAll: svg("0 0 12 12", '<path d="M3 0.8v7.4L9.2 4.5z"/>' + line),
    pauseAll: svg("0 0 12 12", '<path d="M3 0.8h1.8v7.4H3z M6.6 0.8h1.8v7.4H6.6z"/>' + line)
  };
})();
$("fPrev").innerHTML = ICON.back; $("fNext").innerHTML = ICON.next;
$("fPlay").innerHTML = ICON.play; $("play").innerHTML = ICON.playAll;

function seqPlay(){
  const c = P.cuts[i];
  // frames not cached yet show the cut's single picture, so this still runs at the cut's pace
  if(!c || isBlank(c) || cutFrames(c) < 2) return;
  if(curFrame >= cutFrames(c) - 1) showFrame(0);      // played to the end: start over
  seqPlaying = true;
  $("fPlay").innerHTML = ICON.pause;
  seqT0 = performance.now();
  seqStartFrame = curFrame;
  const film = CLOUD && CC.play(vStart(i) + curFrame);      // 雲端看片: the film's own clock, and its sound
  const step = () => {
    if(!seqPlaying) return;
    const n = cutFrames(P.cuts[i]);
    const elapsed = (performance.now() - seqT0) / 1000 * fps();
    const f = film ? CC.now() - vStart(i) : seqStartFrame + Math.floor(elapsed);
    if(f >= n){ seqPause(); showFrame(n - 1); return; }
    if(f !== curFrame) playFrame(f);
    seqRaf = requestAnimationFrame(step);
  };
  seqRaf = requestAnimationFrame(step);
}
/* a frame while playing: one cached but not decoded yet keeps the picture
   before it on screen rather than flashing the cut's single still */
function playFrame(f){
  if(hasSeqFrame(i, f) && !seqCache.has(seqKey(i, f))){ loadSeqFrame(i, f); prefetchSeq(i, f); return; }
  showFrame(f);
}
function seqPause(){
  if(seqPlaying) setTimeout(followCTI, 0);
  if(seqPlaying && CLOUD) CC.pause();
  seqPlaying = false;
  $("fPlay").innerHTML = ICON.play;
  cancelAnimationFrame(seqRaf);
}

/* ---------- capture every frame of a cut ----------
 * Missing frames go to AE in runs of up to GRAB_BATCH per call: one bridge
 * round trip for eight frames instead of eight. A run stops at its first
 * failure; the rest of that run is queued again from the frame after it.
 * Three failures in one cut and the cut is given up -- by then AE is refusing.
 * The caller owns cntBegin/cntEnd, so a batch holds 8 bpc once. */
const GRAB_BATCH = 8;

async function captureCut(n, dir, mode, cancelled, onFrame){
  const c = P.cuts[n], len = cutFrames(c);
  // a cut is captured from its own frames in the comp, which only a sync with
  // this version records
  if(isBlank(c) || !c.aeName || !isFinite(c.aeInF)){
    showError("快取失敗（" + c.no + "）：這卡還沒用這一版讀入過，先按「讀入」再快取。");
    return { got: 0, failed: 1, frames: 0, ms: 0, aeMs: 0 };
  }
  c.seqDir = dir;                      // the one frames folder; callers run syncSeq first
  if(!c.seqHave) c.seqHave = [];
  const have = new Set(c.seqHave);
  const queue = [];
  for(let f = 0; f < len; f++){
    if(have.has(f)) continue;
    const last = queue[queue.length - 1];
    if(last && last.from + last.count === f && last.count < GRAB_BATCH) last.count++;
    else queue.push({ from: f, count: 1 });
  }

  let got = have.size, failed = 0, frames = 0, aeMs = 0;
  const t0 = performance.now();
  const fail = (msg) => {
    failed++;
    if(failed === 1) showError("快取失敗（" + c.no + "）：" + msg);
  };

  while(queue.length){
    if(cancelled()) break;
    const job = queue.shift();
    if(onFrame) onFrame(job.from);
    let r;
    try{
      r = await CEP.call("cntFrames", [c.id, c.aeInF, len, job.from, job.count, dir]);
      if(!r || r.ok === false || !Array.isArray(r.done)) throw new Error((r && r.error) || "AE 沒有回應");
    }catch(err){
      fail(err.message);
      if(failed >= 3) break;
      if(job.count > 1) queue.unshift({ from: job.from + 1, count: job.count - 1 });
      continue;
    }
    for(const f of r.done){
      if(!have.has(f)){ have.add(f); c.seqHave.push(f); got++; frames++; }
    }
    aeMs += r.aeMs || 0;
    if(n === i && r.done.indexOf(curFrame) >= 0){
      await loadSeqFrame(n, curFrame); drawFrame(); drawMarks();
    }
    const bad = r.failed && r.failed[0];
    if(bad){
      fail(bad.error);
      if(failed >= 3) break;
      const rest = job.from + job.count - (bad.frame + 1);
      if(rest > 0) queue.unshift({ from: bad.frame + 1, count: rest });
    }
  }
  c.seqHave.sort((a, b) => a - b);
  return { got, failed, frames, ms: performance.now() - t0, aeMs };
}

/* how long a capture took per frame, for the report after it */
function speedText(r){
  if(!r || !r.frames) return "";
  return "　平均每格 " + Math.round(r.ms / r.frames) + " ms（AE 算圖寫檔 "
    + Math.round(r.aeMs / r.frames) + " ms）";
}
async function grabSequence(){
  if(!inAE) return toast("要在 After Effects 裡才能快取。", true);
  if(grabbing){ cancelGrab = true; return; }
  const c = P.cuts[i];
  if(!c) return;
  if(isBlank(c)) return toast("空號沒有畫面可以快取。", true);
  const { place, switched } = await followProject();
  if(switched){ i = 0; renderAll(); return toast("AE 開的是另一個專案，已換成它的看板。確認是哪一卡後再快取一次。", true); }
  if(!(await ensureDir(place.frames)))
    return showError("快取失敗：建不出快取資料夾 " + (place.frames || "（AE 沒有提供位置）"));
  await syncSeq(i, place);
  const dir = place.frames;

  const n = cutFrames(c);
  const mode = aeMode();
  grabbing = true; cancelGrab = false;
  $("grabSeq").textContent = "中止快取";
  clearError();

  let got = 0, failed = 0, speed = "";
  try{
    try{ await CEP.call("cntBegin", [mode]); }catch(e){}
    const r = await captureCut(i, dir, mode, () => cancelGrab, f => {
      $("seqstate").textContent = "快取中 " + (f + 1) + "／" + n;
    });
    got = r.got; failed = r.failed; speed = speedText(r);
  }finally{
    try{ await CEP.call("cntEnd", []); }catch(e){}
    grabbing = false;
    $("grabSeq").textContent = "快取";
  }
  markDirty();
  showFrame(curFrame);
  toast(cancelGrab ? ("已中止，這卡快取了 " + got + "／" + n + " 格。")
    : ("這卡 " + got + "／" + n + " 格已快取" + (failed ? "，" + failed + " 格失敗。" : "。") + speed));
}

/* ---------- freehand marks ---------- */
let drawing = false, stroke = null;
let penOn = false;          // folded, the picture is for looking: a click does not draw
let pen = { c: "red", w: 1 }, erasing = false;
try{ const p = JSON.parse(localStorage.getItem("cento.pen") || "null");
  if(p && PEN_COLORS[p.c] && PEN_SIZES[p.w]) pen = { c: p.c, w: p.w }; }catch(e){}
function setPen(on){
  penOn = !!on;
  $("stagewrap").classList.toggle("pen-on", penOn);
  $("penBtn").title = penOn ? "收起批註工具（P 或 Esc）" : "畫批註（P）";
  renderTools();
}
function renderTools(){
  document.querySelectorAll(".tools [data-c]").forEach(b => b.classList.toggle("on", !erasing && b.dataset.c === pen.c));
  document.querySelectorAll(".tools [data-w]").forEach(b => b.classList.toggle("on", !erasing && Number(b.dataset.w) === pen.w));
  $("eraseBtn").classList.toggle("on", erasing);
  $("stagewrap").classList.toggle("erasing", penOn && erasing);
}
function choosePen(change){
  Object.assign(pen, change); erasing = false;
  try{ localStorage.setItem("cento.pen", JSON.stringify(pen)); }catch(e){}
  renderTools();
}

/* Every change to the strokes goes on one history, so Ctrl+Z takes back the
 * last thing done -- a stroke, an erase or a clear -- wherever it was. */
const undoStack = [];
function remember(u){ undoStack.push(u); if(undoStack.length > 200) undoStack.shift(); }
/* put a mark's strokes back at `key`, joining whatever was drawn there since */
function restoreMark(c, key, m, idx, strokes, styles){
  if(!c.marks) c.marks = {};
  const into = c.marks[key] || (c.marks[key] = m);
  ensureStyles(into);
  if(into === m && idx != null){ into.strokes.splice(idx, 0, ...strokes); into.styles.splice(idx, 0, ...styles); }
  else if(into !== m){ into.strokes.push(...strokes); into.styles.push(...styles); }
}

function pointOn(ev){
  const cv = $("drawCv"), r = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const x = (ev.clientX - r.left) * dpr, y = (ev.clientY - r.top) * dpr;
  // 4 decimals is a tenth of a pixel on a 4K frame, and keeps the board file small
  const r4 = v => Math.round(v * 1e4) / 1e4;
  return [ r4((x - picBox.x) / picBox.w), r4((y - picBox.y) / picBox.h) ];
}

function markSlot(){
  const c = P.cuts[i];
  if(!c) return null;
  if(!c.marks) c.marks = {};
  const k = String(curFrame);
  if(!c.marks[k]) c.marks[k] = { strokes: [], who: myName(), by: myId(), at: Date.now() };
  return c.marks[k];
}

/* The picture without a cache is the cut's first frame (cntStill at aeAtF),
   so frame 1 can be drawn on as it is; a later frame needs its own picture
   first, or the stroke would sit on the wrong one. A cut not from AE has
   only its one picture. */
function needFrame(c){
  return inAE && !WEB && curFrame > 0 && !!c.aeName && !hasSeqFrame(i, curFrame);
}
function beginStroke(ev){
  if(!penOn) return;
  if(ev.button !== undefined && ev.button !== 0) return;
  const c = P.cuts[i]; if(!c || isBlank(c)) return;
  if(erasing){
    drawing = "erase";
    $("drawCv").setPointerCapture && $("drawCv").setPointerCapture(ev.pointerId);
    eraseAt(ev); ev.preventDefault();
    return;
  }
  if(needFrame(c)){
    ev.preventDefault();
    if(!grabbing) grabSequence();
    toast("第 " + (curFrame + 1) + " 格還沒快取，正在快取這一卡，好了就能畫。");
    return;
  }
  drawing = true;
  stroke = pointOn(ev).slice();
  $("drawCv").setPointerCapture && $("drawCv").setPointerCapture(ev.pointerId);
  ev.preventDefault();
}
function extendStroke(ev){
  if(!drawing) return;
  if(drawing === "erase") return eraseAt(ev);
  const pt = pointOn(ev);
  const n = stroke.length;
  // skip points that add nothing, so a stroke stays small in the saved file
  if(n >= 2 && Math.abs(pt[0] - stroke[n-2]) < 0.002 && Math.abs(pt[1] - stroke[n-1]) < 0.002) return;
  stroke.push(pt[0], pt[1]);
  const cx = $("drawCv").getContext("2d");
  cx.lineCap = "round"; cx.lineJoin = "round";
  cx.strokeStyle = PEN_COLORS[pen.c];
  cx.lineWidth = lineBase(picBox) * PEN_SIZES[pen.w];
  cx.beginPath();
  cx.moveTo(picBox.x + stroke[n-2] * picBox.w, picBox.y + stroke[n-1] * picBox.h);
  cx.lineTo(picBox.x + pt[0] * picBox.w, picBox.y + pt[1] * picBox.h);
  cx.stroke();
}
function endStroke(){
  if(!drawing) return;
  const was = drawing;
  drawing = false;
  if(was === true && stroke && stroke.length >= 4){
    const slot = markSlot();
    if(slot){
      ensureStyles(slot);
      slot.strokes.push(stroke); slot.styles.push({ c: pen.c, w: pen.w });
      slot.at = Date.now(); if(myId()){ slot.who = myName(); slot.by = myId(); }
      remember({ op: "add", cut: P.cuts[i].id, key: String(curFrame), mark: slot, stroke });
      tipOnce("cento.tip.hold", "批註只在這一格。拖時間軸上批註右端的把手，可以延長顯示格數。");
    }
    markDirty(); renderFrameBar(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
  }
  stroke = null;
  drawMarks();
}

/* the eraser takes away the one stroke under the pointer, on any mark showing here */
function eraseAt(ev){
  const c = P.cuts[i]; if(!c || !c.marks) return;
  const r = $("drawCv").getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  const px = (ev.clientX - r.left) * dpr, py = (ev.clientY - r.top) * dpr;
  const near = (x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / L)) : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  };
  let hit = null;
  for(const sp of markSpans(c)){
    if(curFrame < sp.f || curFrame > spanEnd(sp) || !sp.m.strokes) continue;
    sp.m.strokes.forEach((st, k) => {
      const tol = Math.max(8 * dpr, lineBase(picBox) * PEN_SIZES[styleOf(sp.m, k).w]);
      for(let j = 0; j + 3 < st.length; j += 2){
        const d = near(picBox.x + st[j] * picBox.w, picBox.y + st[j+1] * picBox.h,
                       picBox.x + st[j+2] * picBox.w, picBox.y + st[j+3] * picBox.h);
        if(d <= tol && (!hit || d < hit.d)) hit = { d, key: String(sp.f), m: sp.m, k };
      }
    });
  }
  if(!hit) return;
  ensureStyles(hit.m);
  const style = hit.m.styles.splice(hit.k, 1)[0], gone = hit.m.strokes.splice(hit.k, 1)[0];
  if(!hit.m.strokes.length) delete c.marks[hit.key];
  remember({ op: "erase", cut: c.id, key: hit.key, mark: hit.m, idx: hit.k, strokes: [gone], styles: [style] });
  markDirty(); drawMarks(); renderFrameBar(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
}

/* a hint shown once ever, per computer */
function tipOnce(key, msg){
  try{ if(localStorage.getItem(key)) return; localStorage.setItem(key, "1"); }catch(e){ return; }
  toast(msg);
}

function undoStroke(){
  const u = undoStack.pop();
  if(!u){
    // nothing done this session: take back the last stroke on this frame
    const e = editableMark();
    if(!e || !e.m.strokes || !e.m.strokes.length) return;
    ensureStyles(e.m); e.m.strokes.pop(); e.m.styles.pop();
    if(!e.m.strokes.length) delete P.cuts[i].marks[e.k];
    markDirty(); drawMarks(); renderFrameBar(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
    return;
  }
  const n = P.cuts.findIndex(c => c.id === u.cut);
  if(n < 0) return undoStroke();               // that cut is gone; the step before it
  const c = P.cuts[n];
  if(u.op === "add"){
    const k = u.mark.strokes.lastIndexOf(u.stroke);
    if(k < 0) return undoStroke();
    ensureStyles(u.mark); u.mark.strokes.splice(k, 1); u.mark.styles.splice(k, 1);
    if(!u.mark.strokes.length && c.marks && c.marks[u.key] === u.mark) delete c.marks[u.key];
  }else restoreMark(c, u.key, u.mark, u.idx, u.strokes, u.styles);
  // show where it happened
  if(n !== i) select(n);
  const f = Number(u.key), m = c.marks && c.marks[u.key];
  const showing = curFrame >= f && curFrame <= f + Math.max(0, (m && m.hold) | 0);
  if(!showing) showFrame(f);
  markDirty(); drawMarks(); renderFrameBar(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
}
function clearFrameMarks(){
  const e = editableMark();
  if(!e) return;
  ensureStyles(e.m);
  delete P.cuts[i].marks[e.k];
  remember({ op: "clear", cut: P.cuts[i].id, key: e.k, mark: e.m, idx: 0,
             strokes: e.m.strokes.splice(0), styles: e.m.styles.splice(0) });
  markDirty(); drawMarks(); renderFrameBar(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
}

/* extend (or shorten) a mark so it lasts until `f` */
function holdTo(f){
  const c = P.cuts[i], e = editableMark();
  if(!c || !e) return false;
  const start = Number(e.k);
  e.m.hold = Math.max(0, Math.min(cutFrames(c) - 1, f) - start);
  markDirty(); renderFrameBar(); drawMarks(); renderList(); renderStrip(); if(P.cuts[i]) renderNotes(P.cuts[i]);
  return true;
}

const markCount = c => (c && c.marks) ? Object.keys(c.marks).length : 0;

/* ================= disk and export =================
 *
 * Captured frames are hundreds of PNGs per cut, so there has to be a way to see
 * what they cost and throw them away.
 *
 * The video is built in the panel, not in AE: frames are drawn to a canvas and
 * recorded with MediaRecorder. That means no render queue, no output module
 * template -- the two things that have never worked on this machine -- and a
 * cut with no captured sequence simply holds its single picture for its length,
 * so a whole film can be exported before any frame capture is done.
 *
 * Recording is wall-clock paced: MediaRecorder timestamps by real time, so an
 * export takes about as long as the film runs.
 */
/* ================= where CENTO keeps things =================
 * One rule, asked of AE every time -- never remembered from a sync, so it does
 * not matter whether 同步 was pressed or where the project used to live:
 *   project saved    -> next to the .aep: frames in _cento_frames/seq, videos beside it
 *   project unsaved  -> the extension folder: frames/seq and exports
 * A cut's captured frames are whatever is complete on disk in that frames
 * folder. Frames captured before this rule, wherever they ended up, are moved
 * in the first time the cut is used.
 */
const slashes = t => String(t || "").split(String.fromCharCode(92)).join("/");

async function cachePlace(){
  let loc = {};
  if(inAE){ try{ loc = await CEP.call("cntWhere", []); }catch(e){ loc = {}; } }
  const project = loc.project ? slashes(loc.project) : "";
  const projDir = project ? project.split("/").slice(0, -1).join("/") : "";
  const ext = inAE ? slashes(CEP.extensionPath() || "") : "";
  return {
    loc, project, unsaved: !project,
    frames: projDir ? projDir + "/_cento_frames/seq" : (ext ? ext + "/frames/seq" : ""),
    tmp: projDir ? projDir + "/_cento_frames/tmp" : (ext ? ext + "/frames/tmp" : ""),
    videos: projDir || (ext ? ext + "/exports" : ""),
    base: baseName(project || P.project) || "cento"
  };
}

/* The board always belongs to the project open in AE, the same way the
 * folders do. Before anything touches frames or videos, and shortly after a
 * cut is picked, a different project in AE switches the board to that
 * project's own. Otherwise frames recorded by one project's board could be
 * moved into another project's folder. */
async function followProject(){
  const place = await cachePlace();
  if(!inAE) return { place, switched: false };
  const boardProject = slashes(P.project || "").toLowerCase();
  if(boardProject === (place.project || "").toLowerCase()) return { place, switched: false };
  useProject((place.loc && place.loc.project) || "");
  return { place: await cachePlace(), switched: true };
}

// folders are made by AE and checked by looking, never from cep.fs error codes
async function ensureDir(path){
  if(!path || !inAE) return false;
  try{ await CEP.call("cntEnsureDir", [path]); return true; }catch(e){ return false; }
}

function dropDecoded(n){
  const pre = seqKey(n, 0).split(":")[0] + ":";
  for(const k of [...seqCache.keys()]) if(k.startsWith(pre)){
    const b = seqCache.get(k); if(b && b.close) b.close(); seqCache.delete(k);
  }
}

/* bring one cut's frame list in line with the disk */
async function syncSeq(n, place){
  const c = P.cuts[n];
  if(!c || isBlank(c) || !inAE || !place.frames) return;
  if(slashes(P.project || "").toLowerCase() !== (place.project || "").toLowerCase()) return;
  const elsewhere = !!c.seqDir && slashes(c.seqDir).toLowerCase() !== place.frames.toLowerCase();
  if(elsewhere){
    try{ await CEP.call("cntSeqAdopt", [c.seqDir, place.frames, c.id]); }catch(e){}
  }
  let list;
  try{ list = (await CEP.call("cntSeqList", [place.frames, c.id])).frames || []; }catch(e){ return; }
  const changed = elsewhere || (c.seqHave || []).join(",") !== list.join(",");
  c.seqDir = place.frames;
  c.seqHave = list;
  if(changed){ dropDecoded(n); markDirty(); }
}

// the selected cut is checked against the disk shortly after it is chosen
let seqSyncTimer = 0;
function scheduleSeqSync(){
  if(!inAE) return;
  clearTimeout(seqSyncTimer);
  seqSyncTimer = setTimeout(async () => {
    if(grabbing || exporting) return;
    try{
      const { place, switched } = await followProject();
      if(switched){ i = 0; curFrame = 0; renderAll(); return; }
      const n0 = i;
      await syncSeq(n0, place);
      if(i === n0 && !seqPlaying){ renderFrameBar(); showFrame(curFrame); }
    }catch(e){}
  }, 400);
}
const kb = n => n > 1048576 ? (n/1048576).toFixed(1) + " MB" : Math.round(n/1024) + " KB";

async function dropCutFrames(){
  const c = P.cuts[i];
  if(!c || isBlank(c) || !inAE) return;
  try{
    const { place, switched } = await followProject();
    if(switched){ i = 0; renderAll(); return toast("AE 開的是另一個專案，已換成它的看板。確認是哪一卡後再按一次。", true); }
    await syncSeq(i, place);           // anything left elsewhere is moved in, so one clear gets it all
    const r = await CEP.call("cntSeqClear", [place.frames, c.id]);
    dropDecoded(i);
    c.seqHave = [];
    markDirty(); showFrame(0);
    toast("已清除這卡的快取：" + r.removed + " 個檔案（" + kb(r.bytes) + "）。");
  }catch(err){ showError("清除失敗：" + err.message); }
}

// every cut with a picture, frame by frame, in one go
async function grabAllDialog(){
  if(!inAE) return toast("要在 After Effects 裡才能快取。", true);
  if(exporting || grabbing) return toast("正在快取或輸出，等它做完。", true);
  const { place, switched } = await followProject();
  if(switched){ i = 0; renderAll(); }
  const list = P.cuts.map((c, n) => n).filter(n => !isBlank(P.cuts[n]));
  for(const n of list) await syncSeq(n, place);
  const left = n => Math.max(0, cutFrames(P.cuts[n]) - ((P.cuts[n].seqHave || []).length));
  const todo = list.filter(n => left(n) > 0);
  if(!todo.length) return toast("全部卡都已快取。");
  const need = todo.reduce((a, n) => a + left(n), 0);
  openModal("快取全片", `<div class="row2">還有 <b>${todo.length}</b> 卡、<b>${need}</b> 格沒快取。
    快取時 AE 會一格一格算圖，可以隨時中止，已快取的格會留著。</div>`, "開始", async () => {
      if(exporting){ cancelExport = true; return; }
      $("modalGo").textContent = "中止";
      let speed = "";
      try{ speed = await grabMissing(todo, place, t => { $("modalNote").textContent = t; }); }
      catch(err){ $("modalGo").textContent = "開始"; return showError(err.message); }
      $("modalGo").textContent = "開始";
      renderAll(); showFrame(curFrame);
      if(cancelExport){ $("modalNote").textContent = "已中止，已快取的格會留著。"; return; }
      closeModal();
      toast("全部卡已快取。" + (speed || ""));
    });
}

async function diskDialog(){
  if(!inAE) return toast("要在 After Effects 裡才看得到快取用量。", true);
  const { place, switched } = await followProject();
  if(switched){ i = 0; renderAll(); }
  if(!place.frames) return toast("找不到快取資料夾。", true);
  for(let n = 0; n < P.cuts.length; n++) if(P.cuts[n].seqDir) await syncSeq(n, place);
  // frames taken while a project was unsaved live in the extension folder; no
  // board may point at them any more, so they are counted and cleared here too
  // -- nothing is left behind where nobody looks
  const ext = slashes(CEP.extensionPath() || "");
  const spare = ext ? ext + "/frames/seq" : "";
  const dirs = [place.frames];
  if(spare && spare.toLowerCase() !== place.frames.toLowerCase()) dirs.push(spare);
  const sizes = [];
  for(const d of dirs){
    let r = { files: 0, bytes: 0 };
    try{ r = await CEP.call("cntSeqSize", [d, ""]); }catch(e){}
    sizes.push(r);
  }
  const files = sizes.reduce((a, r) => a + (r.files || 0), 0);
  const bytes = sizes.reduce((a, r) => a + (r.bytes || 0), 0);
  const rows = dirs.map((d, k) => `<div class="row2" style="color:var(--mute)">${esc(d)}　${sizes[k].files || 0} 個 · ${kb(sizes[k].bytes || 0)}</div>`).join("");
  openModal("快取用量", `<div class="row2">
      <span>已快取 <b>${files}</b> 格，佔用 <b>${kb(bytes)}</b></span>
    </div>${rows}
    <div class="row2">「清除全部快取」會刪除上面<b>全部</b>資料夾裡的快取檔。批註與文字不受影響，
      之後可以再快取一次。</div>`,
    "清除全部快取", async () => {
      let removed = 0, freed = 0;
      for(const d of dirs){
        try{ const r = await CEP.call("cntSeqClear", [d, ""]); removed += r.removed || 0; freed += r.bytes || 0; }catch(e){}
      }
      for(const b of seqCache.values()) if(b && b.close) b.close();
      seqCache.clear();
      P.cuts.forEach(c => { c.seqHave = []; });
      markDirty(); showFrame(0); closeModal();
      toast("已清除全部快取：" + removed + " 個檔案（" + kb(freed) + "）。");
    });
}

/* ---------- modal ---------- */
let modalGo = null;
function openModal(title, html, goLabel, onGo){

  $("modalBody").innerHTML = html;
  $("modalBody").onclick = null;
  $("modalGo").textContent = goLabel;
  $("modalGo").hidden = !onGo;
  document.querySelector(".sheet-foot").hidden = !onGo;

  $("modalGo").classList.remove("pri");
  modalGo = onGo;
  $("modal").hidden = false;
}
function closeModal(){ $("modal").hidden = true; modalGo = null; }

/* ---------- export ---------- */
let exporting = false, cancelExport = false;

function exportDialog(){
  const rows = P.cuts.map((c, n) => {
    if(isBlank(c)) return "";
    const have = (c.seqHave && c.seqHave.length) || 0;
    const seq = have >= cutFrames(c) ? "已快取" : (inAE ? "要快取 " + (cutFrames(c) - have) + " 格" : "單張");
    return `<label class="pick"><input type="checkbox" data-cut="${n}" checked>
      <span class="nm">${esc(c.no)}${c.aeName ? " · " + esc(c.aeName) : ""}</span>
      <span class="seqd">${seq}</span>
      <span class="len">${lenText(c)}</span></label>`;
  }).join("");
  // one row per question, the label on the left; the cuts fold away under 選卡
  openModal("輸出影片", `<div class="xq"><span class="xk">畫面</span><div class="seg2"><label><input type="radio" name="expLay" value="plain" checked><span>只有畫面</span></label><label><input type="radio" name="expLay" value="full"><span>加上敘述</span></label></div></div>
    <div class="xq"><span class="xk">檔案</span><div class="seg2"><label><input type="radio" name="expSplit" value="one" checked><span>合成一支</span></label><label><input type="radio" name="expSplit" value="each"><span>每卡一支</span></label></div></div>
    <div class="xq"><span class="xk">格式</span><div><div class="seg2"><label><input type="radio" name="expFmt" value="mov" checked><span>MOV（H.264）</span></label><label><input type="radio" name="expFmt" value="webm"><span>WebM</span></label></div><div id="expFf" class="xnote"></div></div></div>
    <div class="xq"><span class="xk">聲音</span><label class="xsw" title="從合成的音訊圖層取聲音"><input type="checkbox" id="expAudio"><i></i></label></div>
    <details class="xcuts"><summary><span id="expCuts"></span><span class="chev">選卡 ›</span></summary>
      <div class="row2"><button class="btn" id="pickAll">全選</button><button class="btn" id="pickNone">全不選</button></div>${rows}
    </details>`, "輸出", runExport);
  $("modalNote").innerHTML = '<span id="expSum"></span>';
  $("modalGo").classList.add("pri");

  const upd = () => {
    const picked = [...document.querySelectorAll("#modalBody input[data-cut]")].filter(x => x.checked);
    const f = picked.reduce((a, x) => a + cutFrames(P.cuts[+x.dataset.cut]), 0);
    const miss = inAE ? picked.reduce((a, x) => {
      const c = P.cuts[+x.dataset.cut];
      return a + Math.max(0, cutFrames(c) - ((c.seqHave && c.seqHave.length) || 0));
    }, 0) : 0;
    const each = document.querySelector('input[name="expSplit"]:checked').value === "each";
    const mov = (document.querySelector('input[name="expFmt"]:checked') || {}).value === "mov";
    const total = document.querySelectorAll("#modalBody input[data-cut]").length;
    $("expCuts").textContent = picked.length === total ? "全部 " + total + " 卡" : "選了 " + picked.length + "／" + total + " 卡";
    $("expSum").innerHTML = "<b>" + (each ? picked.length : Math.min(1, picked.length)) + " 支 " + (mov ? "MOV" : "WebM") + "</b><br>"
      + tc(f) + (miss ? " · 先快取 " + miss + " 格" : "") + (mov ? "" : " · 錄影約需片長時間");
  };
  exportUpd = upd;
  $("modalBody").addEventListener("change", upd);
  $("pickAll").addEventListener("click", () => {
    document.querySelectorAll("#modalBody input[data-cut]").forEach(x => x.checked = true); upd(); });
  $("pickNone").addEventListener("click", () => {
    document.querySelectorAll("#modalBody input[data-cut]").forEach(x => x.checked = false); upd(); });
  upd();
  setupExportTools();
}

async function setupExportTools(){
  const movRadio = document.querySelector('input[name="expFmt"][value="mov"]');
  if(!movRadio) return;
  $("expFf").textContent = "尋找 ffmpeg…";

    sound.checked = false; sound.disabled = true;

function pickCodec(){
  // WebM only: the retiming below rewrites WebM. VP8 first -- it is the
  // cheapest to encode, so the recorder is least likely to fall behind.
  const want = ["video/webm;codecs=vp8", "video/webm;codecs=vp9", "video/webm"];
  for(const m of want) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return null;
}

/* One frame of the exported film, painted on an offscreen canvas: the picture
   (or the cut's single image), the pen marks, the cut number and status, this
   cut's frame number, and in "full" the storyboard text down the right. Both
   the MOV and the WebM path draw with this. */
function makePainter(full, W, H){
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d");

  // In "full" the picture keeps the left two thirds and the storyboard text
  // takes the column on the right; in "plain" the picture has the whole frame
  // and the only thing over it is the pen.
  const BW = full ? Math.round(W*0.66) : W;
  const DOT = { ok: "#5F7DA6", fix: "#CF7A3E", talk: "#A4A4A2" };   // as --ok2, --fix, --talk; 保留 drawn hollow
  const px = n => Math.max(9, Math.round(H*n));

  function wrap(text, maxw){
    const out = [];
    for(const para of String(text || "").split(String.fromCharCode(10))){
      if(!para){ out.push(""); continue; }
      let line = "";
      for(const ch of para){
        if(cx.measureText(line + ch).width > maxw && line){ out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    }
    return out;
  }

  function textCol(c){
    const x = BW + px(0.028), w = W - x - px(0.028);
    let y = px(0.075);
    const put = (label, body, size) => {
      if(!body) return;
      cx.font = "700 " + px(0.019) + "px sans-serif";
      cx.fillStyle = "#7A7A80";
      cx.fillText(label, x, y); y += px(0.031);
      cx.font = px(size) + "px sans-serif";
      cx.fillStyle = "#D8D8DC";
      for(const ln of wrap(body, w)){
        if(y > H - px(0.03)) return;
        cx.fillText(ln, x, y); y += px(size*1.55);
      }
      y += px(0.022);
    };
    if(c.segname){
      cx.font = "700 " + px(0.042) + "px sans-serif";
      cx.fillStyle = "#EDEDF0";
      cx.fillText(c.segname, x, y);
      y += px(0.055);
    }
    put("畫面", c.pic, 0.0225);
    put("內容", c.act, 0.0225);
    put("對白／音效", c.se, 0.0225);
    if(c.notes && c.notes.length)
      put("意見", c.notes.map(n => "· " + (n.who ? n.who + "：" : "") + n.text).join(String.fromCharCode(10)), 0.0225);
  }

  function badge(c, bx, by){
    // cut number and production status, always in the picture's top-left
    const r = px(0.014), pad = px(0.018);
    const x = bx + pad, y = by + pad;
    cx.font = "700 " + px(0.034) + "px sans-serif";
    cx.textBaseline = "top";
    const label = c.no + (c.status ? "  " + STATUS[c.status] : "");
    const tw = cx.measureText(label).width;
    cx.fillStyle = "rgba(0,0,0,.55)";
    cx.fillRect(x, y, r*3 + tw + pad, px(0.05));
    cx.fillStyle = cx.strokeStyle = DOT[c.status] || "#55555C";
    cx.lineWidth = r * 0.45;
    cx.beginPath(); cx.arc(x + r*1.4, y + px(0.025), c.status === "talk" ? r * 0.78 : r, 0, 6.2832);
    if(c.status === "talk") cx.stroke(); else cx.fill();
    cx.fillStyle = "#F2F2F5";
    cx.fillText(label, x + r*2.8, y + px(0.008));
  }

  function counter(f, len, bx, by, bw){
    // this cut's own frame number, in the picture's top-right
    const pad = px(0.018), inset = px(0.014);
    const label = (f + 1) + " / " + len;
    cx.font = "700 " + px(0.034) + "px Consolas, monospace";
    cx.textBaseline = "top";
    const tw = cx.measureText(label).width;
    const x = bx + bw - pad - tw - inset*2, y = by + pad;
    cx.fillStyle = "rgba(0,0,0,.55)";
    cx.fillRect(x, y, tw + inset*2, px(0.05));
    cx.fillStyle = "#F2F2F5";
    cx.fillText(label, x + inset, y + px(0.008));
  }

  const paint = (src, marks, c, f, len) => {
    cx.fillStyle = full ? "#141416" : "#000"; cx.fillRect(0, 0, W, H);
    cx.textBaseline = "top"; cx.textAlign = "left";
    let bx = 0, by = 0, bw = BW, bh = H;
    if(src){
      const iw = src.width || src.naturalWidth, ih = src.height || src.naturalHeight;
      const s = Math.min(BW/iw, H/ih);
      bw = Math.round(iw*s); bh = Math.round(ih*s);
      bx = Math.round((BW-bw)/2); by = Math.round((H-bh)/2);
      cx.drawImage(src, bx, by, bw, bh);
      if(marks && marks.length) paintMarks(cx, marks, { x: bx, y: by, w: bw, h: bh });
    }
    if(c){ badge(c, bx, by); counter(f, len, bx, by, bw); if(full) textCol(c); }
    if(DEMO) watermark();
  };

  function watermark(){
    // demo builds only: the author's signature, small and faint, bottom-right,
    // clear of the badges; the name in text if the picture is missing
    const pad = px(0.02);
    if(demoMark){
      const w = Math.round(W * 0.1), h = Math.round(w * demoMark.height / demoMark.width);
      cx.save();
      cx.globalAlpha = 0.45;
      cx.drawImage(demoMark, W - pad - w, H - pad - h, w, h);
      cx.restore();
      return;
    }
    cx.save();
    cx.font = "700 " + px(0.024) + "px sans-serif";
    cx.textBaseline = "alphabetic"; cx.textAlign = "right";
    cx.fillStyle = "rgba(255,255,255,.35)";
    cx.fillText("HSU HAO", W - pad, H - pad);
    cx.restore();
  }

  return { cv, cx, paint };
}

async function runExport(){
  if(exporting){ cancelExport = true; return; }
  const picked = [...document.querySelectorAll("#modalBody input[data-cut]")]
    .filter(x => x.checked).map(x => +x.dataset.cut);
  if(!picked.length) return toast("沒有選任何一卡。", true);
  if(DEMO) await demoMarkReady;
  if(demoExpired()) return toast("測試版已於 " + DEMO_UNTIL + " 到期，無法再輸出影片；看板與批註仍可檢視。", true);

  const full = document.querySelector('input[name="expLay"]:checked').value === "full";
  const fmt = (document.querySelector('input[name="expFmt"]:checked') || {}).value || "webm";
  const withAudio = !!($("expAudio") && $("expAudio").checked && !$("expAudio").disabled);

  // one place for everything, and every chosen cut checked against the disk
  const { place, switched } = await followProject();
  if(switched){ closeModal(); i = 0; renderAll(); return toast("AE 開的是另一個專案，已換成它的看板。請重新選擇要輸出的卡。", true); }
  if(inAE) for(const n of picked) await syncSeq(n, place);

  // 1. capture every frame the chosen cuts are still missing. Outside After
  //    Effects there is nothing to capture from, and cuts keep their picture.
  $("modalGo").textContent = "中止";
  cancelExport = false;
  let grabSpeed;
  try{ grabSpeed = await grabMissing(picked, place, t => { $("modalNote").textContent = t; }); }
  catch(err){ $("modalGo").textContent = "輸出"; return showError(err.message); }
  $("modalGo").textContent = "輸出";
  if(cancelExport){ $("modalNote").textContent = "已中止快取。"; return; }

  // 2. record. Every frame is painted, handed to the recorder, and given two
  //    rendering frames to be captured in: two requests inside one rendering
  //    frame collapse into a single captured frame, which is how frames went
  //    missing. The recorder stamps frames with the wall clock, which is never
  //    exact, so each file is afterwards rewritten with frame k at k / fps.
  // Where the files go. AE is asked directly instead of relying on the last
  // 同步: an export done without syncing first had no folder, fell back to a
  // browser download -- which does nothing inside a panel -- and the video
  // was recorded and then silently dropped.
  const loc = place.loc || {};
  const base = place.base;
  const unsaved = inAE && place.unsaved;
  const split = document.querySelector('input[name="expSplit"]:checked').value === "each";
  const outDir = (inAE && place.videos) ? (split ? place.videos + "/" + base + "_cuts" : place.videos) : null;
  if(inAE && !(await ensureDir(outDir)))
    return showError("輸出失敗：建不出輸出資料夾 " + (outDir || "（AE 沒有提供專案位置）"));

  const probe = await loadStill(P.cuts[picked[0]]);
  const W = loc.width || (aeInfo && aeInfo.width) || (probe && probe.width) || 1280;
  const H = loc.height || (aeInfo && aeInfo.height) || (probe && probe.height) || 720;

  const { cv, cx, paint } = makePainter(full, W, H);
  const F = fps();

  if(fmt === "mov"){
    await exportMov({ picked, place, outDir, base, split, W, H, F, paint, cv,
                      withAudio, grabSpeed, unsaved });
    return;
  }

  const mime = pickCodec();
  if(!mime) return showError("這個環境不支援錄影（MediaRecorder）。");

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const nextPaint = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const total = picked.reduce((a, n) => a + cutFrames(P.cuts[n]), 0);
  let done = 0;

  // one recording: the given cuts, back to back
  async function recordGroup(list, label){
    const stream = cv.captureStream(0);
    const track = stream.getVideoTracks()[0];
    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    // "start" fires only once the encoder is running AND a frame has arrived,
    // so it cannot be awaited before the first frame -- it is awaited right
    // after it, below
    let started = false;
    rec.onstart = () => { started = true; };
    rec.start();
    await nextPaint();

    let sent = 0, next = performance.now();
    try{
      for(const n of list){
        if(cancelExport) break;
        const c = P.cuts[n];
        const len = cutFrames(c);
        const hasSeq = !!(c.seqHave && c.seqHave.length);
        const still = hasSeq ? null : await loadStill(c);
        if(hasSeq){
          seqAnchor = { cut: n, frame: 0 };
          await Promise.all(c.seqHave.slice(0, 12).map(f => loadSeqFrame(n, f)));
        }
        let lastSrc = still;
        for(let f = 0; f < len; f++){
          if(cancelExport) break;
          let src = still;
          if(hasSeq){
            seqAnchor = { cut: n, frame: f };
            // a frame that failed to capture holds the last good one
            src = seqCache.get(seqKey(n, f)) || await loadSeqFrame(n, f) || lastSrc;
            for(let d = 1; d <= 12 && f + d < len; d++) loadSeqFrame(n, f + d);
            if(src) lastSrc = src;
          }
          paint(src, marksOf(c, f), c, f, len);
          track.requestFrame();
          sent++; done++;
          await nextPaint();
          if(sent === 1){
            // a laptop on battery slows down, and a large recorder can take a while to start
            const g0 = performance.now();
            while(!started && performance.now() - g0 < 15000){
              if(performance.now() - g0 > 3000) saveState("錄影器啟動中…");
              await nextPaint();
            }
            if(!started) throw new Error("錄影器 15 秒內沒有啟動。電腦可能太忙，或筆電正在用電池（會降速）：插上電源、關掉其他程式，或改用較小的尺寸再試一次");
            next = performance.now();
          }
          if(done % 6 === 0)
            $("modalNote").textContent = label + "　" + tc(done) + " / " + tc(total);
          // stay near real time so the encoder never queues up; never burst to
          // catch up -- the timestamps are rewritten afterwards anyway
          next += 1000 / F;
          const lag = next - performance.now();
          if(lag > 1) await wait(lag); else next = performance.now();
        }
      }
    }finally{
      // let the last frame reach the encoder before stopping: stopped straight
      // after it, the final frame can be left out
      await wait(1000 / F); await nextPaint();
      if(rec.state !== "inactive") await new Promise(r => { rec.onstop = r; rec.stop(); });
      track.stop();
    }
    return { blob: new Blob(chunks, { type: mime }), sent };
  }

  // A panel's first MediaRecorder needs close to a second to bring its
  // encoder up. Until then frames are dropped or replaced by repeats of
  // earlier ones -- a short cut came out with no frames at all. Measured: the
  // "start" event fires once the encoder is really running, and recorders made
  // after that start at once. So a throwaway recording is fed blank frames
  // until it has started (plus a few), and the real recordings follow it.
  async function warmUp(){
    const stream = cv.captureStream(0);
    const track = stream.getVideoTracks()[0];
    const rec = new MediaRecorder(stream, { mimeType: mime });
    let started = false, extra = 6;
    rec.onstart = () => { started = true; };
    rec.start();
    const t0 = performance.now();
    try{
      while(performance.now() - t0 < 10000 && (!started || extra-- > 0)){
        cx.fillStyle = "#000"; cx.fillRect(0, 0, W, H);
        track.requestFrame();
        await nextPaint();
      }
    }finally{
      if(rec.state !== "inactive") await new Promise(r => { rec.onstop = r; rec.stop(); });
      track.stop();
    }
    return started;
  }

  const groups = split ? picked.map(n => [n]) : [picked];
  const safe = t => String(t).replace(/[^\w.-]/g, "_");   // cut numbers are plain ids

  exporting = true; cancelExport = false;
  $("modalGo").textContent = "中止";
  clearError();
  const wrote = [], problems = [];
  let bytes = 0;
  try{
    $("modalNote").textContent = "準備錄影…";
    if(!(await warmUp())) problems.push("錄影器 10 秒內沒有啟動，輸出可能缺格");
    for(let g = 0; g < groups.length; g++){
      if(cancelExport) break;
      const list = groups[g];
      const no = P.cuts[list[0]].no;
      const name = split ? base + "_" + safe(no) + ".webm" : base + "_preview.webm";
      const label = split ? "輸出 " + no + "（" + (g + 1) + " / " + groups.length + " 支）" : "輸出中";
      let r;
      try{ r = await recordGroup(list, label); }
      catch(err){ problems.push(name + "：" + err.message); continue; }
      if(cancelExport) break;
      if(!r.blob.size){ problems.push(name + "：錄影沒有產生資料"); continue; }

      let out = r.blob;
      try{
        const fixed = remuxWebm(new Uint8Array(await r.blob.arrayBuffer()), F);
        out = fixed.blob;
        if(fixed.frames !== r.sent)
          problems.push(name + "：送出 " + r.sent + " 格，錄到 " + fixed.frames + " 格——逐格不保證");
      }catch(err){
        problems.push(name + (r.blob.size < 1024 ? "：錄影沒有畫格" : "：時間碼無法重排（" + err.message + "）")
          + "——逐格不保證");
      }
      if(await saveVideo(outDir, name, out)){ wrote.push(name); bytes += out.size; }
      else problems.push((outDir ? outDir + "/" : "") + name + "：寫檔失敗");
    }
  }finally{
    seqAnchor = null;
    exporting = false;
    $("modalGo").textContent = "輸出";
  }

  const shown = inAE ? outDir : "瀏覽器的下載資料夾";
  const note = unsaved ? "（專案還沒存檔，所以放在擴充功能資料夾）" : "";
  if(problems.length){
    showError("輸出有問題：" + problems.join("；")
      + (wrote.length ? "。已寫出 " + wrote.length + " 支，在 " + shown + note : ""));
  }
  if(cancelExport){ toast("已中止，寫出 " + wrote.length + " 支。", true); return; }
  if(!wrote.length) return;
  closeModal();
  if(!problems.length)
    banner("已輸出 " + wrote.length + " 支（" + kb(bytes) + "）到 " + shown + note
      + "，每格都對齊 1/" + F + " 秒。" + grabSpeed, "info");
  toast("已輸出 " + wrote.length + " 支，位置寫在上方。");
}


/* ================= MOV export =================
 *
 * Every frame is painted and written to disk as a JPEG, then ffmpeg turns the
 * sequence into an H.264 MOV. Nothing is recorded in real time, so an export
 * takes as long as painting and encoding take -- not as long as the film runs
 * -- and every frame is exactly one frame long by construction.
 *
 * With sound, each cut takes the part of every audio layer that plays under
 * it, straight from the layer's own file: seeked to the right place, delayed
 * if the layer starts inside the cut, padded with silence where no layer
 * covers it, mixed if several do, and finally joined cut after cut. Volume and
 * level keyframes in After Effects are not read.
 */
const FF_LS = "cento.ffmpeg";
let ffState = null;                 // { path, h264, aac } | { error } | null

function ffCandidates(){
  const out = [];
  // the copy that ships with the panel (tools/deploy.ps1 fetches it), then
  // wherever one was found last time, then the usual places
  const ext = slashes(CEP.extensionPath() || "");
  if(ext) out.push(ext + "/bin/ffmpeg.exe", ext + "/bin/ffmpeg");
  try{ const saved = localStorage.getItem(FF_LS); if(saved) out.push(saved); }catch(e){}
  out.push("ffmpeg");               // on PATH
  out.push("C:/Program Files/Krita (x64)/bin/ffmpeg.exe");
  out.push("C:/Program Files/Krita/bin/ffmpeg.exe");
  out.push("/usr/local/bin/ffmpeg", "/usr/bin/ffmpeg", "/opt/homebrew/bin/ffmpeg");
  return out;
}

/* what can this ffmpeg encode? also proves it runs at all */
async function ffAsk(path){
  const r = await CEP.run(path, ["-hide_banner", "-encoders"]);
  const out = String((r && r.out) || "");
  // the encoder name is the proof: a build that lists one is ffmpeg and can
  // make the MOV. Headers and wording differ between builds, so they are not
  // relied on.
  const h264 = ["libx264", "libopenh264", "h264_nvenc", "h264_qsv", "h264_amf"]
    .find(n => out.indexOf(" " + n + " ") >= 0);
  if(!h264) throw new Error(out ? "這個 ffmpeg 沒有 H.264 編碼器" : "不是 ffmpeg");
  return { path, h264, aac: out.indexOf(" aac ") >= 0 };
}

async function ffFind(force){
  if(ffState && !force) return ffState;
  if(!CEP.canRun || !CEP.canRun()){ ffState = { error: "這個環境不能執行外部程式" }; return ffState; }
  for(const path of ffCandidates()){
    try{
      const info = await ffAsk(path);
      try{ localStorage.setItem(FF_LS, path); }catch(e){}
      ffState = info;
      return ffState;
    }catch(e){}
  }
  ffState = { error: "找不到 ffmpeg" };
  return ffState;
}

async function fileExists(path){

const safeName = t => String(t).replace(/[^0-9A-Za-z._-]/g, "_");
const pad6 = n => ("00000" + n).slice(-6);

const canvasJpeg = (cv, q) => new Promise((res, rej) => cv.toBlob(b => {
  if(!b) return rej(new Error("畫格轉檔失敗"));
  const fr = new FileReader();
  fr.onload = () => res(new Uint8Array(fr.result));
  fr.onerror = () => rej(new Error("畫格讀不回來"));
  fr.readAsArrayBuffer(b);
}, "image/jpeg", q));

/* paint the chosen cuts frame by frame into dir as f_000001.jpg ... */
async function writeSeqFrames(list, dir, paint, cv, onProgress, noMarks){
  const total = list.reduce((a, n) => a + cutFrames(P.cuts[n]), 0);
  let k = 0;
  for(const n of list){
    const c = P.cuts[n], len = cutFrames(c);
    const hasSeq = !!(c.seqHave && c.seqHave.length);
    const still = hasSeq ? null : await loadStill(c);
    if(hasSeq){
      seqAnchor = { cut: n, frame: 0 };
      await Promise.all(c.seqHave.slice(0, 12).map(f => loadSeqFrame(n, f)));
    }
    let lastSrc = still;
    for(let f = 0; f < len; f++){
      if(cancelExport) return k;
      let src = still;
      if(hasSeq){
        seqAnchor = { cut: n, frame: f };
        // a frame that failed to capture holds the last good one
        src = seqCache.get(seqKey(n, f)) || await loadSeqFrame(n, f) || lastSrc;
        for(let d = 1; d <= 12 && f + d < len; d++) loadSeqFrame(n, f + d);
        if(src) lastSrc = src;
      }
      paint(src, noMarks ? [] : marksOf(c, f), c, f, len);
      const bytes = await canvasJpeg(cv, 0.9);
      if(CEP.writeBinary(dir + "/f_" + pad6(++k) + ".jpg", bytes) === false)
        throw new Error("寫不出暫存畫格");
      if(onProgress && k % 5 === 0) onProgress(k, total);
      if(k % 20 === 0) await new Promise(r => setTimeout(r, 0));   // let the panel breathe
    }
  }
  return k;
}

/* capture every frame these cuts are still missing; says how fast it went.
   Outside After Effects there is nothing to capture from: cuts keep their picture. */
async function grabMissing(list, place, onNote){
  const missing = n => {
    const c = P.cuts[n];
    return Math.max(0, cutFrames(c) - ((c.seqHave && c.seqHave.length) || 0));
  };
  const toGrab = inAE ? list.filter(n => missing(n) > 0) : [];
  if(!toGrab.length) return "";
  if(!(await ensureDir(place.frames)))
    throw new Error("快取失敗：建不出快取資料夾 " + (place.frames || "（AE 沒有提供位置）"));
  const dir = place.frames;
  const mode = aeMode();
  const need = toGrab.reduce((a, n) => a + missing(n), 0);
  let grabbed = 0;
  const grabStat = { frames: 0, ms: 0, aeMs: 0 };
  exporting = true; cancelExport = false;
  clearError();
  try{
    try{ await CEP.call("cntBegin", [mode]); }catch(e){}
    for(const n of toGrab){
      if(cancelExport) break;
      const before = (P.cuts[n].seqHave || []).length;
      const cr = await captureCut(n, dir, mode, () => cancelExport, f => {
        onNote("快取 " + P.cuts[n].no + " · 第 " + (f + 1) + " 格　（全部 " + grabbed + " / " + need + "）");
      });
      grabbed += P.cuts[n].seqHave.length - before;
      grabStat.frames += cr.frames; grabStat.ms += cr.ms; grabStat.aeMs += cr.aeMs;
    }
  }finally{
    try{ await CEP.call("cntEnd", []); }catch(e){}
    exporting = false;
    markDirty();
  }
  if(cancelExport) return "";
  const short = toGrab.filter(n => missing(n) > 0).map(n => P.cuts[n].no);
  if(short.length)
    toast("有 " + short.length + " 卡沒快取齊（" + short.join("、")
      + "），缺的格會用最近快取到的格補上。", true);
  return speedText(grabStat);
}

/* ---------- 雲端看片: the film ----------
 * One video of the whole board -- every cut with a picture, in order -- at
 * 720 lines with the comp's sound, without marks: those come from the sheet,
 * drawn live over it. Written next to the exports as <project>_cloud.mp4.
 * Returns where it is and where each cut starts in it. */
async function makeFilm(onNote){
  if(!inAE) throw new Error("要在 After Effects 裡才能做片子");
  if(exporting) throw new Error("正在輸出影片，等它做完");
  const list = P.cuts.map((c, n) => n).filter(n => !isBlank(P.cuts[n]));
  if(!list.length) throw new Error("看板是空的");
  const { place, switched } = await followProject();
  if(switched) throw new Error("AE 開的是另一個專案，請先讀入");
  for(const n of list) await syncSeq(n, place);
  cancelExport = false;
  await grabMissing(list, place, onNote);
  if(cancelExport) throw new Error("已中止");
  const ff = await ffFind();
  if(ff.error) throw new Error(ff.error);
  const tmp = place.tmp;
  if(!tmp || !place.videos || !(await ensureDir(place.videos))) throw new Error("建不出輸出資料夾");
  const loc = place.loc || {};
  const W0 = loc.width || (aeInfo && aeInfo.width) || 1280, H0 = loc.height || (aeInfo && aeInfo.height) || 720;
  const H = Math.min(720, H0) & ~1, W = Math.round(W0 * H / H0 / 2) * 2;
  const { cv, paint } = makePainter(false, W, H);
  const F = fps();
  const layers = await audioLayers();
  const out = place.videos + "/" + place.base + "_cloud.mp4";
  exporting = true; cancelExport = false;
  try{
    try{ await CEP.call("cntTmpClear", [tmp]); }catch(e){}
    if(!(await ensureDir(tmp))) throw new Error("建不出暫存資料夾");
    const n = await writeSeqFrames(list, tmp, paint, cv, (k, of) => onNote("做片子　畫格 " + k + " / " + of), true);
    if(cancelExport) throw new Error("已中止");
    if(!n) throw new Error("沒有畫格");
    try{ await CEP.call("cntRemove", [out]); }catch(e){}
    onNote("做片子　編碼中…");
    const res = await CEP.run(ff.path, movArgs({ tmp, fps: F, ff, layers, list, out, W, H, rate: "1500k", gop: F }), line => {
      const a = line.indexOf("frame=");
      if(a >= 0) onNote("做片子　編碼中 " + line.slice(a, a + 24));
    });
    if(!(await fileExists(out))) throw new Error("ffmpeg 沒有產生檔案。" + String((res && res.out) || "").slice(-200));
  }finally{
    seqAnchor = null;
    exporting = false;
    try{ await CEP.call("cntTmpClear", [tmp]); }catch(e){}
  }
  const vStart = {};
  let at = 0;
  list.forEach(n => { vStart[P.cuts[n].id] = at; at += cutFrames(P.cuts[n]); });
  return { path: out, vStart, frames: at, W, H };
}

/* each cut's picture, small, for the sheet: shown before the film is in */
async function filmThumbs(){
  const out = {}, cv = document.createElement("canvas"), cx = cv.getContext("2d");
  for(let n = 0; n < P.cuts.length; n++){
    const c = P.cuts[n];
    if(isBlank(c)) continue;
    let src = await loadStill(c);
    if(!src && hasSeqFrame(n, 0)) src = await loadSeqFrame(n, 0);
    if(!src) continue;
    const iw = src.width || src.naturalWidth, ih = src.height || src.naturalHeight;
    cv.width = 640; cv.height = Math.max(2, Math.round(640 * ih / iw));
    cx.drawImage(src, 0, 0, cv.width, cv.height);
    try{ out[c.id] = cv.toDataURL("image/jpeg", 0.7); }catch(e){}
  }
  return out;
}

/* the board as 雲端看片 gets it: no paths from this computer; notes and marks
   anybody signed come from the sheet's 紀錄 instead */
function filmBoard(vStart){
  const b = JSON.parse(JSON.stringify(P));
  delete b.cloud;
  b.cuts.forEach(c => {
    delete c.seqDir; delete c.aeSrc; delete c.seqHave; delete c.media;
    c.vStart = c.id in vStart ? vStart[c.id] : null;
    if(c.notes) c.notes = c.notes.filter(x => !x.by);
    if(c.marks) Object.keys(c.marks).forEach(k => { if(c.marks[k] && c.marks[k].by) delete c.marks[k]; });
  });
  return b;
}

/* the ffmpeg command line for one output file */
function movArgs(o){
  const { tmp, fps, ff, layers, list, out, W, H } = o;
  const args = ["-y", "-framerate", String(fps), "-i", tmp + "/f_%06d.jpg"];
  // H.264 needs even dimensions, and the sequence carries no pixel format
  const filters = ["[0:v]scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p[vout]"];
  const cuts = [];
  let input = 1;

  if(layers.length){
    // Cuts that follow each other in the comp are one stretch of sound, taken
    // in one piece: cutting every cut out on its own and joining the pieces
    // left an audible skip at each join. Only real gaps (cuts left out of the
    // export) are joined.
    const RATE = 48000;
    const smp = f => Math.round(f * RATE / fps);     // comp frame -> sample, same rounding everywhere
    const runs = [];
    for(const n of list){
      const c = P.cuts[n], a = c.aeInF | 0, b = a + cutFrames(c);
      const last = runs[runs.length - 1];
      if(last && last.out === a) last.out = b;
      else runs.push({ in: a, out: b });
    }
    for(const run of runs){
      const total = smp(run.out) - smp(run.in);
      const parts = [];
      for(const L of layers){
        const from = Math.max(L.inF, run.in), to = Math.min(L.outF, run.out);
        if(to <= from) continue;                       // this layer is silent here
        // no -ss: seeking in compressed audio lands a little off, and each
        // seek restarts the decoder. The whole file is decoded and trimmed by
        // sample count, which is exact.
        const src0 = L.srcInF + (from - L.inF), src1 = src0 + (to - from);
        args.push("-i", L.file);
        const tag = "a" + input;
        const delay = ((smp(from) - smp(run.in)) * 1000 / RATE).toFixed(3);
        filters.push("[" + input + ":a]aresample=" + RATE + ",asetpts=N/SR/TB,atrim=start_sample="
          + smp(src0) + ":end_sample=" + smp(src1) + ",asetpts=N/SR/TB,adelay=" + delay + "|" + delay
          + "[" + tag + "]");
        parts.push("[" + tag + "]");
        input++;
      }
      const tag = "c" + cuts.length;
      const fit = "apad,atrim=end_sample=" + total + ",asetpts=N/SR/TB[" + tag + "]";
      if(!parts.length){
        // silence for a stretch no layer covers. Made by muting the first
        // layer's own file: the silence sources are a filter device that
        // some ffmpeg builds (Krita's, for one) are compiled without.
        args.push("-i", layers[0].file);
        filters.push("[" + input + ":a]volume=0,aresample=" + RATE + "," + fit);
        input++;
      }else if(parts.length === 1){
        filters.push(parts[0] + fit);
      }else{
        filters.push(parts.join("") + "amix=inputs=" + parts.length + ":normalize=0:duration=longest," + fit);
      }
      cuts.push("[" + tag + "]");
    }
    filters.push(cuts.length > 1
      ? cuts.join("") + "concat=n=" + cuts.length + ":v=0:a=1[aout]"
      : cuts[0] + "anull[aout]");
  }

  args.push("-filter_complex", filters.join(";"), "-map", "[vout]");
  if(layers.length) args.push("-map", "[aout]", "-c:a", "aac", "-b:a", "192k");
  else args.push("-an");
  args.push("-c:v", ff.h264, "-b:v", o.rate || ((W * H >= 1920 * 1080) ? "8M" : "4M"));
  if(o.gop) args.push("-g", String(o.gop));        // a key frame every second: a browser seeks fast
  args.push("-movflags", "+faststart", out);
  return args;
}

async function exportMov(o){
  const { picked, place, outDir, base, split, W, H, F, paint, cv, withAudio, grabSpeed, unsaved } = o;
  if(!inAE) return showError("MOV 要在 After Effects 裡才能輸出。");
  const ff = await ffFind();
  if(ff.error) return showError("輸出失敗：" + ff.error + "。改選 WebM，或在輸出視窗填 ffmpeg 的路徑。");
  const tmp = place.tmp;
  if(!tmp || !(await ensureDir(tmp))) return showError("輸出失敗：建不出暫存資料夾 " + (tmp || ""));

  const layers = withAudio ? await audioLayers() : [];
  if(withAudio && !layers.length) toast("這個合成裡沒有帶檔案的音訊圖層，這次不含聲音。", true);

  const groups = split ? picked.map(n => [n]) : [picked];
  exporting = true; cancelExport = false;
  $("modalGo").textContent = "中止";
  clearError();
  const wrote = [], problems = [];
  try{
    for(let g = 0; g < groups.length; g++){
      if(cancelExport) break;
      const list = groups[g];
      const no = P.cuts[list[0]].no;
      const name = (split ? base + "_" + safeName(no) : base + "_preview") + ".mov";
      const label = split ? "輸出 " + no + "（" + (g + 1) + " / " + groups.length + " 支）" : "輸出中";
      const target = outDir + "/" + name;

      try{ await CEP.call("cntTmpClear", [tmp]); }catch(e){}
      if(!(await ensureDir(tmp))){ problems.push(name + "：建不出暫存資料夾"); continue; }

      let frames = 0;
      try{
        frames = await writeSeqFrames(list, tmp, paint, cv, (k, of) => {
          $("modalNote").textContent = label + "　畫格 " + k + " / " + of;
        });
      }catch(err){ problems.push(name + "：" + err.message); continue; }
      if(cancelExport) break;
      if(!frames){ problems.push(name + "：沒有畫格"); continue; }

      $("modalNote").textContent = label + "　編碼中…";
      // an older export of the same name would otherwise pass for this one
      try{ await CEP.call("cntRemove", [target]); }catch(e){}
      let res = null;
      try{
        res = await CEP.run(ff.path, movArgs({ tmp, fps: F, ff, layers, list, out: target, W, H }),
          line => {
            const at = line.indexOf("frame=");
            if(at >= 0) $("modalNote").textContent = label + "　編碼中 " + line.slice(at, at + 24);
          });
      }catch(err){ problems.push(name + "：ffmpeg 啟動失敗（" + err.message + "）"); continue; }

      if(await fileExists(target)) wrote.push(name);
      else problems.push(name + "：ffmpeg 沒有產生檔案。" + String((res && res.out) || "").slice(-300));
    }
  }finally{
    seqAnchor = null;
    exporting = false;
    $("modalGo").textContent = "輸出";
    try{ await CEP.call("cntTmpClear", [tmp]); }catch(e){}
  }

  const note = unsaved ? "（專案還沒存檔，所以放在擴充功能資料夾）" : "";
  if(problems.length){
    showError("輸出有問題：" + problems.join("；")
      + (wrote.length ? "。已寫出 " + wrote.length + " 支，在 " + outDir + note : ""));
  }
  if(cancelExport){ toast("已中止，寫出 " + wrote.length + " 支。", true); return; }
  if(!wrote.length) return;
  closeModal();
  if(!problems.length)
    banner("已輸出 " + wrote.length + " 支 MOV 到 " + outDir + note
      + (layers.length ? "，含聲音" : "") + "，每格都對齊 1/" + F + " 秒。" + grabSpeed, "info");
  toast("已輸出 " + wrote.length + " 支，位置寫在上方。");
}

async function saveVideo(dir, name, blob){
  if(inAE){
    // a browser download goes nowhere inside a panel, so there is no fallback
    if(!dir) return false;
    try{
      const ok = CEP.writeBinary(dir + "/" + name, new Uint8Array(await blob.arrayBuffer()));
      return ok !== false;
