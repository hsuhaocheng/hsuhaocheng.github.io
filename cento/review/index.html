<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTO</title>
<style>
/* Cutting-room monitor. Single visual world, every colour explicit — this panel
   lives inside After Effects' own dark UI and should read as part of it. */
:root{
  /* Neutrals match After Effects' own dark UI, so the panel sits inside it
     without announcing itself. Pure greys, no colour cast. */
  --void:#1A1A1A; --panel:#232323; --panel2:#2C2C2C;
  --edge:#141414; --edge2:#3A3A3A;
  --ink:#D3D3D1; --ink2:#B0B0AE; --mute:#959593;

  /* Text and colours from 配色 A 藍鼠 (docs/strategy/ui_colors.md): soft
     off-white text, every size at least 4.5:1, and one restrained blue
     (藍鼠/縹) -- a saturated blue on a dark ground shimmers over a long session. */
  --accent:#7095CC; --accent-hi:#9DB6DC; --accent-dim:#40587C; --accent-ghost:#1F2632;

  /* Two colours and greys. Blue is the accent and, a step quieter, 通過;
     orange is 重修; 保留 is grey drawn hollow or hatched. ✓ ↻ ‖ and
     lightness keep them apart. Orange also stays clear of the red pen (#E1503C). */
  --ok2:#5F7DA6; --fix:#CF7A3E; --talk:#A4A4A2;
  --ok:#5F7DA6; --stage:#101010;
  --hold:repeating-linear-gradient(135deg,#8E8E8C 0 2px,#3A3A3A 2px 5px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--ink); overflow:hidden;
  font-family:"Noto Sans TC","Microsoft JhengHei","Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:Consolas,"Roboto Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.lab{font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--mute)}

.app{height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr); min-height:0}
/* pinned: a hidden banner leaves the grid, and the main area must still get the 1fr row */
.bar{grid-row:1} .banner{grid-row:2} .main{grid-row:3}

/* Full width, directly under the controls. The old place -- the bottom of a
   scrolling inspector -- put the message off screen exactly when it mattered. */
.banner{display:flex; align-items:flex-start; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--edge); background:var(--accent-ghost);
  border-left:3px solid var(--accent); font-size:12.5px; line-height:1.6; color:var(--ink)}
.banner.info{background:var(--panel2); border-left-color:var(--edge2); color:var(--ink2)}
.banner .msg{flex:1; min-width:0; user-select:text; -webkit-user-select:text;
  word-break:break-word; font-family:Consolas,monospace; font-size:12px;
  max-height:3.4em; overflow-y:auto}
.banner.open .msg{max-height:40vh}
.banner .btn{padding:3px 9px; font-size:11.5px; flex:0 0 auto}

/* ---- top bar: where the cuts come from on the left, what goes out on the right ---- */
.bar{display:flex; align-items:center; gap:10px; row-gap:6px; padding:7px 12px;
  border-bottom:1px solid var(--edge); background:var(--panel); flex-wrap:wrap}
.build{font-family:Consolas,monospace; font-size:10px; color:var(--mute);
  letter-spacing:.04em; white-space:nowrap}
.brand{font-weight:700; font-size:12.5px; letter-spacing:.18em; text-transform:uppercase; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:220px}
.grow{flex:1}
.btn{border:1px solid var(--edge2); padding:5px 11px; font-size:12.5px; color:var(--ink2); white-space:nowrap}
.btn:hover{color:var(--ink); border-color:var(--mute)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.savest{font-size:11px; color:var(--mute); white-space:nowrap}
.savest.dirty{color:var(--ink2)}

/* one control for reading the comp: the body reads, ▾ picks how cuts are split */
.src{position:relative; display:flex; align-items:stretch; border:1px solid var(--edge2); min-width:0}
.src:hover{border-color:var(--mute)}
.src > button{display:flex; align-items:center; gap:6px; padding:4px 10px; font-size:12.5px;
  color:var(--ink); white-space:nowrap; min-width:0}
.src > button:hover{background:var(--accent-ghost)}
.src > button:disabled{opacity:.5; cursor:default; background:none}
.src .ic{color:var(--accent)}
.src .comp{font-family:Consolas,monospace; font-size:12px; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis; max-width:240px}
.src .comp:empty{display:none}
.src-mode{border-left:1px solid var(--edge2)!important; color:var(--ink2)!important; padding:4px 8px!important}
.prog{flex:0 0 120px; height:3px; background:var(--edge2); position:relative; display:none}
.prog.on{display:block}
.prog i{position:absolute; left:0; top:0; bottom:0; background:var(--accent); width:0}
.progtxt{font-family:Consolas,monospace; font-size:11px; color:var(--mute); white-space:nowrap}

/* small menus that drop from a button */
.pop{position:absolute; z-index:70; top:calc(100% + 4px); left:0; min-width:240px;
  background:var(--panel2); border:1px solid var(--edge2); box-shadow:0 8px 24px rgba(0,0,0,.5); padding:4px 0}
.pop.right{left:auto; right:0}
.pop .hd{padding:6px 14px 4px; font-size:11px; color:var(--mute)}
.pop button{display:flex; gap:8px; width:100%; text-align:left; padding:6px 14px; font-size:12.5px;
  color:var(--ink); white-space:nowrap}
.pop button:hover{background:var(--accent-ghost)}
.pop button:disabled{opacity:.4; cursor:default; background:none}
.pop button .ck{flex:0 0 12px; color:var(--accent)}
.pop button.danger{color:var(--fix)}
.pop hr{border:0; border-top:1px solid var(--edge2); margin:4px 0}
.watch{display:inline-flex; align-items:center; height:26px; padding:0 2px 0 7px}
.watch i{width:22px; height:22px; border-radius:50%; margin-left:-5px; border:2px solid var(--panel); color:#fff; font-size:11px; font-style:normal;
  display:inline-flex; align-items:center; justify-content:center; line-height:1}
.watch i.n{background:var(--edge2); color:var(--ink2)}
.pop .wrow{display:flex; gap:8px; align-items:center; padding:5px 14px; font-size:12.5px; white-space:nowrap; width:100%; text-align:left}
.pop .wrow .lv{width:7px; height:7px; border-radius:50%; background:var(--ok2)}
.pop .wrow small{margin-left:auto; padding-left:16px; color:var(--mute); font-size:11px}
.pop .ln{padding:0 14px 8px 34px; font-size:11.5px; color:var(--ink2); white-space:normal; line-height:1.5}
.more{position:relative}
.more > .btn{padding:4px 10px; font-size:15px; line-height:1.2}

/* ---- three columns; both sides fold to a 28px rail ---- */
.main{display:grid; grid-template-columns:auto minmax(0,1fr) auto; min-height:0}
.list{width:220px; border-right:1px solid var(--edge); background:var(--panel);
  display:flex; flex-direction:column; min-height:0; overflow:hidden; transition:width .2s ease}
.insp{width:340px; border-left:1px solid var(--edge); background:var(--panel);
  display:flex; flex-direction:column; min-height:0; overflow:hidden; transition:width .2s ease}
body.still .list, body.still .insp{transition:none}
.fold{padding:1px 7px; font-size:12px; color:var(--ink2); border:1px solid transparent; flex:0 0 auto}
.fold:hover{border-color:var(--edge2); color:var(--ink)}
.rail{display:none; flex:1; flex-direction:column; align-items:center; gap:10px; padding:12px 0;
  cursor:pointer; color:var(--ink2); font-size:12px}
.rail:hover{background:var(--panel2); color:var(--ink)}
.rail .arw{font-size:11px}
.rail .nm{writing-mode:vertical-rl; letter-spacing:3px}
.rail .bd{font-family:Consolas,monospace; font-size:10.5px; writing-mode:vertical-rl; color:var(--ink2)}
.rail .bd.ok{color:var(--accent-hi)} .rail .bd.fix{color:var(--fix)} .rail .bd.talk{color:var(--ink2)}
body.lc .list{width:28px}
body.lc .list > :not(.rail){display:none!important}
body.lc .list > .rail{display:flex}
body.rc .insp{width:28px}
body.rc .insp > :not(.rail){display:none!important}
body.rc .insp > .rail{display:flex}

/* ---- cut list ---- */
.list-head{display:flex; align-items:center; gap:6px; padding:7px 9px 4px 11px}
.list-head .lab{color:var(--ink2); letter-spacing:.08em}
.list-head .btn{padding:1px 8px; font-size:12px}
.list-sum{padding:0 11px 7px; font-size:11px; color:var(--mute); border-bottom:1px solid var(--edge);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rows{overflow-y:auto; flex:1; min-height:0}
.row{display:grid; grid-template-columns:9px 34px minmax(0,1fr) 12px; align-items:center; gap:8px;
  padding:6px 6px 6px 8px; border-bottom:1px solid var(--edge); cursor:pointer;
  border-left:3px solid transparent}
.row:hover{background:var(--panel2)}
.row.on{background:var(--panel2); border-left-color:var(--accent)}
.row.drag{opacity:.35} .row.over{border-top:2px solid var(--accent)}
.row.dim{opacity:.45}
.row .th{width:34px; aspect-ratio:16/9; background:var(--stage); border:1px solid var(--edge2);
  display:grid; place-items:center; overflow:hidden}
.row .th img{width:100%; height:100%; object-fit:contain; display:block}
.row .tx{min-width:0; display:flex; flex-direction:column; line-height:1.35}
.row .nm{font-family:Consolas,monospace; font-size:12px; color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row.on .nm{color:var(--ink)}
.row .fr{font-size:10.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row.on .fr{color:var(--ink2)}
.row .fr .mono{font-size:10.5px}
.row .grip{color:var(--mute); font-size:11px; letter-spacing:-2px; visibility:hidden; cursor:grab}
.row:hover .grip{visibility:visible}
.row.blank .nm{color:var(--mute); font-style:italic}
.row.blank .th{background:transparent; border-style:dashed}
.seghead{padding:6px 11px 3px; font-size:10.5px; font-weight:700; letter-spacing:.08em;
  color:var(--accent); background:var(--void);
  border-bottom:1px solid var(--edge); position:sticky; top:0; z-index:1}
.seghead span{color:var(--mute); margin-left:8px; font-weight:400}

/* ---- picture column ---- */
.stagewrap{display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--void)}

/* the thin bar over the picture: the pen on the left, where you are on the right.
   Nothing sits on the picture itself. */
.picbar{display:flex; align-items:center; gap:6px; min-height:36px; padding:6px 16px 0; min-width:0; flex-wrap:wrap}
.pen{width:30px; height:26px; border:1px solid var(--edge2); color:var(--ink2); font-size:14px; line-height:1}
.pen:hover{color:var(--ink); border-color:var(--mute)}
#immBtn.on{border-color:var(--accent); background:var(--accent-ghost); color:var(--accent-hi)}
.stagewrap.pen-on #penBtn{border-color:var(--accent); background:var(--accent-ghost); color:var(--accent-hi)}
.tools{display:none; align-items:center; gap:4px}
.stagewrap.pen-on .tools{display:flex}
.picbar > .btn{padding:2px 9px; font-size:11.5px}
.tools .sw{width:20px; height:20px; display:grid; place-items:center; border:1px solid transparent}
.tools .sw::after{content:""; width:12px; height:12px; border-radius:50%; background:var(--sw)}
.tools .sw.on{border-color:var(--ink)}
.tools .sz{width:22px; height:22px; display:grid; place-items:center; border:1px solid transparent; color:var(--ink2)}
.tools .sz i{display:block; border-radius:50%; background:currentColor}
.tools .sz.on{border-color:var(--ink); color:var(--ink)}
.tools .sw:hover,.tools .sz:hover{border-color:var(--mute)}
/* eraser, undo, clear: drawn, their words in the tooltip */
.tools .tic{width:24px; height:22px; display:grid; place-items:center; border:1px solid transparent; color:var(--ink2)}
.tools .tic svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round}
.tools .tic:hover{border-color:var(--mute); color:var(--ink)}
.tools .tic.on{border-color:var(--accent); background:var(--accent-ghost); color:var(--accent-hi)}
.tools .tsep{width:1px; height:16px; background:var(--edge2); margin:0 3px}
.stagewrap.erasing #drawCv{cursor:cell}
.stagetag{font-family:Consolas,monospace; font-size:11.5px; color:var(--ink2); white-space:nowrap}
.stagetag b{color:var(--ink); font-weight:500}
.seqstate{font-size:11px; color:var(--mute); white-space:nowrap}
.seqstate.on{color:var(--accent)}

.stagebox{flex:1; display:flex; padding:6px 16px 8px; min-height:0; position:relative}
.stage{position:relative; flex:1; min-width:0; min-height:0; background:var(--stage);
  border:1px solid var(--edge2); display:flex; align-items:center; justify-content:center; overflow:hidden}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.stage #drawCv{cursor:default; touch-action:none}
.stagewrap.pen-on #drawCv{cursor:crosshair}
.stage .empty{color:var(--mute); font-size:13px; text-align:center; padding:22px; position:relative}
.stage .steps{display:flex; flex-direction:column; gap:8px; text-align:left; color:var(--ink2); font-size:14px}
.stage .steps b{color:var(--ink); font-size:15px}
.stage .steps #emptyGo{align-self:center; margin-top:6px; padding:5px 20px; background:var(--accent); border-color:var(--accent); color:#fff}
/* nothing read in yet: only 讀入 and the first steps */
body.blank .main{grid-template-columns:minmax(0,1fr)}
body.blank .list, body.blank .insp, body.blank .picbar, body.blank .transport, body.blank .tl, body.blank .cap,
body.blank #shareBtn, body.blank #cloudBox, body.blank #dot{display:none!important}
.stagewrap.dz .stage{border-color:var(--accent); border-style:dashed}
.dzhint{position:absolute; inset:6px 16px 8px; display:grid; place-items:center; pointer-events:none;
  color:var(--accent); font-size:14px; background:rgba(11,12,14,.72)}

/* ---- one transport row ---- */
.transport{display:flex; align-items:center; gap:6px; row-gap:4px; padding:0 16px 6px; flex-wrap:wrap}
.tbtn{height:26px; min-width:30px; padding:0 9px; border:1px solid var(--edge2); color:var(--ink2);
  font-size:12px; line-height:1; white-space:nowrap}
.tbtn:hover{color:var(--ink); border-color:var(--mute)}
/* one set: no boxes, one geometry, the 本卡 ▶ a size up and brighter */
.tbtn.ico{display:flex; align-items:center; justify-content:center; padding:0; min-width:28px; border-color:transparent}
.tbtn.ico:hover{border-color:transparent; background:var(--panel2)}
.tbtn.ico svg{width:12px; height:12px; display:block; fill:currentColor}
.tbtn.ico.main{min-width:34px; color:var(--ink)}
.tbtn.ico.main svg{width:16px; height:16px}
#play{margin-left:6px}
.readout{margin-left:auto; font-family:Consolas,monospace; font-size:12px; color:var(--ink2);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.readout b{color:var(--ink); font-weight:500}
.readout .sep{display:inline-block; width:1px; height:12px; background:var(--edge2); margin:0 10px; vertical-align:-1px}

/* ---- timeline: every cut as wide as it is long. Thin while the list is open,
   thumbnails when it is folded or in 專心看. The cut you are on is widened and
   carries its frames. ---- */
.tl{position:relative; margin:0 16px 8px; user-select:none}
.tl-scenes{display:none; height:16px}
body.thumbs .tl-scenes{display:flex}
.tl-scenes div{min-width:0; font-size:10.5px; color:var(--ink2); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; border-left:2px solid var(--accent-dim); padding-left:5px; line-height:14px}
.tl-scenes b{color:var(--accent); margin-right:4px; font-weight:500}
.strip{display:flex; gap:1px; height:18px}
body.thumbs .strip{height:64px; gap:2px}
.cut{position:relative; min-width:0; background:var(--panel2); cursor:pointer; overflow:hidden;
  display:flex; flex-direction:column; border:1px solid var(--edge)}
.cut .st{flex:1; background:var(--edge2)}
.cut .st.ok{background:var(--ok2)} .cut .st.fix{background:var(--fix)} .cut .st.talk{background:var(--hold)}
.cut .im,.cut .no,.cut .nt{display:none}
body.thumbs .cut .st{flex:0 0 5px}
body.thumbs .cut .im{display:flex; flex:1; min-height:0; overflow:hidden; align-items:center;
  justify-content:center; background:var(--stage)}
.cut .im img{width:100%; height:100%; object-fit:cover; opacity:.75}
.cut:hover .im img,.cut.on .im img{opacity:1}
body.thumbs .cut .no{display:block; position:absolute; left:4px; top:3px; font-family:Consolas,monospace;
  font-size:10px; line-height:1.4; color:var(--ink); background:rgba(0,0,0,.6); padding:0 3px}
body.thumbs .cut .nt{display:block; position:absolute; right:4px; top:3px; font-size:10px; line-height:1.4;
  color:var(--ink); background:rgba(0,0,0,.6); padding:0 3px}
.cut.segstart{border-left:2px solid var(--accent)}
.cut.on{border-color:var(--accent-hi)}
.cut.blank{flex:0 0 10px!important; background:repeating-linear-gradient(45deg,#2C2C2C 0 3px,#1A1A1A 3px 6px)}
body.thumbs .cut.blank{flex-basis:22px!important}
.cut.dim{opacity:.25}
.cut.on.dim{opacity:.45}
.tl-head{position:absolute; top:0; width:2px; background:#F2F2F0; pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.5)}

/* frames of the cut you are on, laid over its slot: click or drag to pick one */
.ftrack{position:absolute; cursor:pointer; touch-action:none; background-color:rgba(0,0,0,.4);
  box-shadow:inset 0 0 0 1px var(--accent-hi)}
.ftrack[hidden]{display:none}
.fcur{position:absolute; top:0; bottom:0; background:rgba(242,242,240,.6); pointer-events:none}
/* an annotation: a bar along the top from its own frame to the end of its hold,
   in the accent colour (red would read as 重修), with a grip on its right end
   you drag to make it last longer */
.fspan{position:absolute; top:0; bottom:0; min-width:2px; border-top:4px solid var(--accent);
  background:rgba(112,149,204,.16); pointer-events:none}
.fspan.on{border-top-color:var(--accent-hi); background:rgba(157,182,220,.28)}
.fspan .grip{position:absolute; right:-5px; top:-4px; bottom:0; width:10px; cursor:ew-resize; pointer-events:auto}
.fspan .grip::after{content:""; position:absolute; right:4px; top:0; bottom:0; width:2px;
  background:var(--ink); border-radius:1px}

/* ---- storyboard text under the timeline ---- */
.cap{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding:0 16px 12px}
.cap textarea{height:56px; resize:none; font-size:12.5px}

/* ---- 專心看: only the picture, the transport and the timeline ---- */
body.imm .bar, body.imm .banner, body.imm .list, body.imm .insp,
body.imm .picbar > :not(#immBtn), body.imm .cap{display:none!important}
body.imm .main{grid-template-columns:minmax(0,1fr)}
body.imm .stagebox{padding-top:12px}
.immhint{position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:80; pointer-events:none;
  background:rgba(0,0,0,.78); color:#EEE; padding:7px 14px; font-size:12.5px; opacity:0; transition:opacity .4s}
.immhint.show{opacity:1}

/* ---- review column ---- */
.filt{display:flex; align-items:flex-start; gap:6px; padding:9px 10px 9px 12px; border-bottom:1px solid var(--edge)}
/* the filter row: how far the review is, then each status as its coloured
   square and a count -- the same squares as the exported PDF; a click filters */
.chips{flex:1; display:flex; gap:3px; align-items:center; flex-wrap:wrap}
.chips button{display:inline-flex; align-items:center; gap:4px; height:26px; padding:0 6px 0 3px; border:1px solid transparent; border-radius:4px;
  color:var(--ink); font:12.5px Consolas,monospace; white-space:nowrap}
.chips button:hover{border-color:var(--edge2)}
.chips button.on{border-color:var(--ink); background:var(--panel2)}
.chips .sq{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:3px;
  font:700 11.5px/1 "Segoe UI Symbol",sans-serif; color:#fff}
.chips .sq.ok{background:var(--ok2)} .chips .sq.fix{background:var(--fix)} .chips .sq.talk{background:#8f8f8c}
.chips .sq.notes{background:none; color:var(--accent-hi); font-size:13px}
.chips .pbar{position:relative; width:34px; height:4px; border-radius:2px; background:var(--edge2); margin-right:3px}
.chips .pbar i{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--ink2)}
.chips button[data-f="none"]{padding:0 7px; color:var(--ink2)} .chips button[data-f="none"] b{color:var(--ink); font-weight:500}

.insp-head{position:relative; padding:10px 14px; border-bottom:1px solid var(--edge);
  display:flex; align-items:center; gap:12px}
.cutno{font-family:Consolas,monospace; font-size:34px; font-weight:700; line-height:1;
  padding:0; letter-spacing:-.02em; color:var(--ink); white-space:nowrap}
.cutno:not(:disabled):hover{color:var(--accent-hi)}
.cutno:disabled{cursor:default}
.insp-head .f{flex:1; min-width:0}
.insp-head .pop{left:10px; min-width:270px}
.cutmeta{font-size:11px; color:var(--mute); line-height:1.5}
.talk{display:inline-flex; align-items:center; gap:3px; color:var(--accent-hi); font-family:Consolas,monospace}
.talk .bub{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.4}
.insp-body{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding:12px 14px 0}
.f{display:flex; flex-direction:column; gap:4px}
.f textarea,.f input{background:var(--panel2); border:1px solid var(--edge);
  padding:7px 9px; font-size:13px; line-height:1.5; color:var(--ink); width:100%}
.f textarea:focus,.f input:focus{border-color:var(--accent-dim); outline:none}
.f textarea::placeholder,.f input::placeholder{color:var(--mute)}
.f input{padding:4px 8px; font-size:12.5px}

/* ---- review: status + notes ---- */
.stat-dot{width:7px; height:7px; border-radius:50%; background:transparent;
  border:1px solid var(--edge2); flex:0 0 auto}
.stat-dot.ok{background:var(--ok2); border-color:var(--ok2)}
.stat-dot.fix{background:var(--fix); border-color:var(--fix)}
.stat-dot.talk{background:transparent; border:1.5px solid var(--talk)}

.statbar{display:flex; gap:5px}
.statbar button{flex:1; border:1px solid var(--edge2); padding:8px 0; font-size:13px; color:var(--ink2)}
.statbar button:hover{color:var(--ink); border-color:var(--mute)}
.statbar button.on{color:var(--void); font-weight:700}
.statbar button.on[data-s="ok"]{background:var(--ok2); border-color:var(--ok2)}
.statbar button.on[data-s="fix"]{background:var(--fix); border-color:var(--fix)}
.statbar button.on[data-s="talk"]{background:transparent; border:1.5px solid var(--talk); color:var(--ink)}
.statbar button:disabled{opacity:.35; cursor:default}

.notes{flex:1; min-height:0; display:flex; flex-direction:column; gap:4px}
#noteList{flex:1; min-height:40px; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:2px 0 8px}
.note{border-left:2px solid var(--edge2); padding:5px 0 5px 9px}
.note .meta{font-size:10.5px; color:var(--mute); display:flex; gap:8px; align-items:baseline}
.note .meta b{color:var(--ink2); font-weight:600}
.note .meta .del{margin-left:auto; color:var(--mute); font-size:11px; padding:0 3px}
.note .meta .del:hover{color:var(--fix)}
.note .orphan{color:var(--mute); font-size:11px; margin:0}
.replies{margin:3px 0 0 2px; padding-left:9px; border-left:1px solid var(--edge2)}
.reply{padding:3px 0}
.reply .meta{font-size:10px; color:var(--mute); display:flex; gap:8px; align-items:baseline}
.reply .meta b{color:var(--ink2); font-weight:600}
.reply .meta .del{margin-left:auto; color:var(--mute); font-size:10.5px; padding:0 3px}
.reply .meta .del:hover{color:var(--fix)}
.reply p{margin:1px 0 0; font-size:12px; line-height:1.6; color:var(--ink); white-space:pre-wrap; word-break:break-word}
.reply-add{display:block; padding:2px 0 0; font-size:11px; color:var(--mute)}
.reply-add:hover{color:var(--ink)}
.replies .mkin{display:block; width:100%; margin-top:3px; background:var(--panel2); border:1px solid var(--accent-dim); color:var(--ink); padding:2px 7px; font-size:12px; line-height:1.5; outline:none}
.note.mk .mkline{display:flex; align-items:baseline; gap:8px; margin:2px 0 0; font-size:13px; line-height:1.7}
.note.mk .mkgo{flex:0 0 auto; padding:0; font-family:Consolas,monospace; font-size:12.5px; color:var(--accent-hi); white-space:nowrap}
.note.mk .mkgo:hover{text-decoration:underline}
.note.mk .mktext{flex:1; min-width:0; cursor:text; white-space:pre-wrap; word-break:break-word}
.note.mk .mkadd{padding:0; font-size:11.5px; color:var(--mute)}
.note.mk .mkadd:hover{color:var(--ink)}
.note.mk .mkin{flex:1; min-width:0; background:var(--panel2); border:1px solid var(--accent-dim); color:var(--ink);
  padding:2px 7px; font-size:12.5px; line-height:1.5; outline:none}
.note.mk.on{border-left-color:var(--accent)}
.note p{margin:2px 0 0; font-size:13px; line-height:1.7; white-space:pre-wrap; word-break:break-word}
.noteempty{color:var(--mute); font-size:12px; padding:12px 0; text-align:center}
.noteadd{display:flex; flex-direction:column; gap:6px; padding:10px 14px 12px; border-top:1px solid var(--edge)}
.noteadd textarea,.noteadd input{background:var(--panel2); border:1px solid var(--edge); color:var(--ink);
  padding:6px 9px; font-size:12.5px; line-height:1.5; width:100%; resize:none}
.noteadd textarea:focus,.noteadd input:focus{border-color:var(--accent-dim); outline:none}
.noteadd textarea{min-height:52px}
.noteadd .go{display:flex; gap:7px; align-items:center}
.noteadd .go{position:relative}
.noteadd .go .whois{flex:1; display:flex; align-items:center; gap:3px; min-width:0; font-size:12px; color:var(--mute); white-space:nowrap}
.note .meta .nwho{color:var(--ink2); font-weight:600; padding:1px 3px; border-bottom:1px dashed var(--edge2)}
.note .meta .nwho:hover{color:var(--ink); border-bottom-color:var(--mute)}
/* who signs: one pill, its menu renames or switches */
.whois .whoname{max-width:100%; overflow:hidden; text-overflow:ellipsis; color:var(--ink2); padding:1px 10px; border:1px solid var(--edge2); border-radius:12px}
.whois .whoname:hover{color:var(--ink); border-color:var(--mute)}
.whois .whoname.none{color:var(--accent-hi); border-color:var(--accent-dim)}
.note .meta .nwho{font-size:10.5px; margin-left:-3px}
.pop.up{top:auto; bottom:calc(100% + 4px)}
.pop .row{display:flex; gap:6px; padding:4px 10px 6px; align-items:center}
.pop .row input{flex:1; min-width:0; background:var(--panel); border:1px solid var(--edge); color:var(--ink); padding:4px 8px; font-size:12.5px}
.pop .row input:focus{border-color:var(--accent-dim); outline:none}
.pop .row button{width:auto; padding:4px 10px; border:1px solid var(--edge2)}
.pop .row button.go1{border-color:var(--accent-dim); color:var(--accent-hi)}
#renamePop{position:fixed; width:260px}

.modal{position:fixed; inset:0; background:rgba(10,10,10,.72); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:28px}
.sheet{background:var(--panel); border:1px solid var(--edge2); width:min(520px,94vw);
  max-height:82vh; display:flex; flex-direction:column}
.sheet-head,.sheet-foot{display:flex; align-items:center; gap:10px; padding:11px 14px}
.sheet-head{border-bottom:1px solid var(--edge)}
.sheet-foot{border-top:1px solid var(--edge)}
.sheet-body{overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.sheet .grow{flex:1}
.pick{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink2);
  padding:3px 0; border-bottom:1px solid var(--edge)}
.pick:last-child{border-bottom:0}
.pick input{flex:0 0 auto}
.pick .nm{flex:1; font-family:Consolas,monospace; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.pick .len{font-family:Consolas,monospace; font-size:11px; color:var(--mute)}
.pick .seqd{font-size:10.5px; color:var(--accent)}
.sheet-body .row2{display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink2)}
.syncrow{display:flex; align-items:center; gap:10px}
/* 輸出影片: a label on the left, equal choices on the right */
.xq{display:grid; grid-template-columns:3em minmax(0,1fr); align-items:center; gap:10px; font-size:12.5px}
.xq .xk{color:var(--mute)}
.seg2{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1px solid var(--edge2); border-radius:4px; overflow:hidden}
.seg2 label{position:relative}
.seg2 input{position:absolute; opacity:0; pointer-events:none}
.seg2 span{display:block; padding:5px 8px; text-align:center; color:var(--ink2); cursor:pointer}
.seg2 label + label span{border-left:1px solid var(--edge2)}
.seg2 input:checked + span{background:var(--accent-dim); color:#fff}
.seg2 input:disabled + span{opacity:.35; cursor:default}
.seg2 input:focus-visible + span{outline:1px solid var(--accent-hi); outline-offset:-2px}
.xnote{font-size:11px; color:var(--fix); margin-top:4px} .xnote:empty{display:none}
.xsw{position:relative; width:34px; height:20px; cursor:pointer}
.xsw input{position:absolute; opacity:0}
.xsw i{position:absolute; inset:0; border-radius:10px; background:var(--edge2); transition:background .15s}
.xsw i::after{content:""; position:absolute; left:2px; top:2px; width:16px; height:16px; border-radius:50%; background:var(--ink); transition:left .15s}
.xsw input:checked + i{background:var(--accent)} .xsw input:checked + i::after{left:16px; background:#fff}
.xsw input:disabled + i{opacity:.35; cursor:default}
.xsw input:focus-visible + i{outline:1px solid var(--accent-hi)}
.xcuts summary{display:flex; justify-content:space-between; align-items:center; list-style:none; cursor:pointer;
  padding:7px 10px; background:var(--panel2); border-radius:4px; font-size:12.5px}
.xcuts summary::-webkit-details-marker{display:none}
.xcuts .chev{color:var(--accent-hi)} .xcuts[open] .chev{visibility:hidden}
.xcuts .row2{margin:8px 0 4px}
#modalNote #expSum{display:block; line-height:1.4; font-family:inherit}
#modalGo.pri{background:var(--accent); border-color:var(--accent); color:#fff; padding-inline:18px} #modalNote #expSum b{color:var(--ink); font-weight:500; font-size:13px}
#modalNote{font-size:11.5px; color:var(--mute)}
.keys{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:12.5px; color:var(--ink2)}
.keys kbd{font-family:Consolas,monospace; border:1px solid var(--edge2); padding:0 5px; font-size:11.5px; color:var(--ink)}

.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--panel2);
  border:1px solid var(--edge2); padding:9px 15px; font-size:13px; z-index:50;
  max-width:min(600px,92vw); line-height:1.6}
.toast.err{border-color:var(--accent-dim); color:var(--accent)}

/* Narrow panel: the list stays a column beside the picture (folded unless you
   opened it), the review column goes underneath. */
@media (max-width:1080px){
  body{overflow:auto} .app{height:auto; min-height:100%}
  .main{grid-template-columns:auto minmax(0,1fr)}
  .stagebox{flex:none; display:block}
  .stage{aspect-ratio:16/9; width:100%}
  .rows{max-height:60vh}
  .insp,body.rc .insp{grid-column:1 / -1; width:auto; border-left:0; border-top:1px solid var(--edge)}
  body.rc .insp > .rail{flex-direction:row; height:32px; padding:0 14px; justify-content:flex-start}
  body.rc .insp > .rail .nm, body.rc .insp > .rail .bd{writing-mode:horizontal-tb; letter-spacing:0}
  .insp-body{overflow:visible} #noteList{max-height:none; overflow:visible}
}
@media (max-width:640px){ .cap{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 網頁看片 and 雲端看片 on a phone: the picture on top, then two tabs --
   卡 (the list) and 意見 (status, notes, writing) */
.mtabs{display:none}
@media (max-width:700px){
  body.web .main{display:flex; flex-direction:column}
  body.web .stagewrap{order:0} body.web .mtabs{order:1} body.web .list, body.web .insp{order:2}
  body.web .mtabs{display:flex; position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--edge)}
  body.web .mtabs button{flex:1; padding:10px 0 8px; color:var(--mute); font-size:14px; border-bottom:2px solid transparent}
  body.web .mtabs button.on{color:var(--ink); border-bottom-color:var(--accent)}
  body.web .mtabs b{color:var(--accent); font-weight:500; margin-left:4px}
  body.web .list, body.web.lc .list, body.web .insp, body.web.rc .insp{width:auto; border:0}
  body.web.lc .list > :not(.rail), body.web.rc .insp > :not(.rail){display:revert!important}
  body.web .list{display:flex}
  body.web.mt-notes .list, body.web:not(.mt-notes) .insp{display:none!important}
  body.web .rail, body.web .fold, body.web .list-head{display:none!important}
  body.web .rows{max-height:none}
  body.web .list-sum{padding:8px 12px 2px}
}

/* 網頁看片: only watching and reviewing -- what needs After Effects, and changing the cuts, stays with the host */
body.web .src, body.web #aeCancel, body.web #shareBtn, body.web #grabSeq, body.web #seqstate,
body.web #ctiBtn, body.web #grabAllBtn, body.web #diskBtn, body.web #dropSeq, body.web #morePop hr:first-of-type, body.web #morePop hr:nth-of-type(2),
body.web #addCut, body.web #delCut, body.web .grip{display:none!important}
body.web #fNo{pointer-events:none}
body.web .cap textarea, body.web #fSeg{opacity:.85}
.sharepop{min-width:250px}
.sharepop button small{display:block; color:var(--mute); font-size:11px; margin-top:1px}
#inviteBtn, #webBtn{flex-direction:column; gap:1px}
/* the top bar's boxes: one height, one size */
header.bar .btn{height:26px; padding:0 11px; font-size:12.5px; line-height:1; display:inline-flex; align-items:center}
header.bar #moreBtn{font-size:15px}
/* ⋯: every item's text on one line, the tick column kept for all */
#morePop > button:not(#ctiBtn){padding-left:34px}
/* PDF／試算表 is under 分享 ▾ in After Effects; a browser has no 分享, so ⋯ keeps it there */
body:not(.web) #notesBtn{display:none}
.sharepop .hd{padding:6px 12px 2px; font-size:11px; color:var(--mute)}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand" id="brand">CENTO</div>
    <span class="build" id="build" title="面板版本。和安裝的版本不同時，表示裝進 AE 的是舊版。"></span>
    <div class="src">
      <button id="aeSync" title="讀入 AE 目前合成的卡，不會改動 AE"><span class="ic">⟳</span>讀入<span class="comp" id="compName"></span></button>
      <button class="src-mode" id="aeModeBtn" title="切卡方式" aria-label="切卡方式">▾</button>
      <div class="pop" id="modePop" hidden></div>
    </div>
    <button class="btn" id="aeCancel" hidden>中止</button>
    <div class="prog" id="prog"><i id="progBar"></i></div>
    <span class="progtxt" id="progTxt"></span>
    <div class="grow"></div>
    <span class="savest" id="dot" title="看板會自動存檔"></span>
    <div class="more" id="watchWrap" hidden>
      <button class="watch" id="watchBtn" title="正在看的人" aria-label="正在看的人"></button>
      <div class="pop right" id="watchPop" hidden></div>
    </div>
    <div class="more">
      <button class="btn" id="shareBtn" title="給別人看這個看板">分享 ▾</button>
      <div class="pop right sharepop" id="sharePop" hidden>
        <button id="inviteBtn"><b>雲端同步</b><small>不在同一網路的人看</small></button>
        <hr>
        <div class="hd">給一個檔案</div>
        <button id="exportBtn">影片…</button>
        <button id="shareNotes">PDF／試算表…</button>
      </div>
    </div>
    <div class="more">
      <button class="btn" id="moreBtn" title="更多" aria-label="更多">⋯</button>
      <div class="pop right" id="morePop" hidden>
        <button id="ctiBtn" title="同步面板的時間點到 AE 時間軸"><span class="ck" id="ctiCk"></span>AE 時間軸同步</button>
        <hr>
        <button id="grabAllBtn">快取全片</button>
        <button id="diskBtn">快取用量</button>
        <button class="danger" id="dropSeq">清除這卡的快取</button>
        <hr>
        <button id="keysBtn">快捷鍵</button>
        <button id="reportBtn">回報問題</button>
        <button id="aboutBtn">關於 CENTO</button>
      </div>
    </div>
  </header>

  <div class="modal" id="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <b id="modalTitle">輸出影片</b>
        <span class="grow"></span>
        <button class="btn" id="modalClose">關閉</button>
      </div>
      <div class="sheet-body" id="modalBody"></div>
      <div class="sheet-foot">
        <span class="mono" id="modalNote"></span>
        <span class="grow"></span>
        <button class="btn" id="modalGo">開始</button>
      </div>
    </div>
  </div>

  <div class="banner" id="banner" hidden>
    <span class="msg" id="bannerMsg"></span>
    <button class="btn" id="bannerMore">展開</button>
    <button class="btn" id="bannerCopy">複製</button>
    <button class="btn" id="bannerClose">✕</button>
  </div>

  <div class="main">
    <section class="list">
      <div class="list-head"><span class="lab">清單</span>
        <button class="fold" id="listFold" title="收起清單（[）">«</button>
        <span class="grow"></span>
        <button class="btn" id="addCut" title="新增一卡">＋</button>
        <button class="btn" id="delCut" title="刪除這一卡">－</button>
      </div>
      <div class="list-sum" id="listSum"></div>
      <div class="rows" id="rows"></div>
      <div class="rail" id="listRail" title="展開清單（[）">
        <span class="arw">»</span><span class="nm">清單</span><span class="bd" id="listRailNo"></span>
      </div>
    </section>

    <section class="stagewrap" id="stagewrap">
      <div class="picbar">
        <button class="pen" id="penBtn" title="畫批註（P）">✎</button>
        <button class="pen" id="immBtn" title="專心看：只留畫面、播放列和時間軸（F）" aria-label="專心看">⛶</button>
        <div class="tools">
          <button class="sw" data-c="red" style="--sw:#E1503C" title="紅"></button>
          <button class="sw" data-c="yellow" style="--sw:#F2C14E" title="黃"></button>
          <button class="sw" data-c="blue" style="--sw:#4EA8F2" title="藍"></button>
          <button class="sw" data-c="white" style="--sw:#FFFFFF" title="白"></button>
          <i class="tsep"></i>
          <button class="sz" data-w="1" title="細"><i style="width:3px;height:3px"></i></button>
          <button class="sz" data-w="2" title="中"><i style="width:6px;height:6px"></i></button>
          <button class="sz" data-w="3" title="粗"><i style="width:10px;height:10px"></i></button>
          <button class="tic" id="eraseBtn" title="橡皮擦：點一筆就擦掉那一筆" aria-label="橡皮擦"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 13.2L2.8 10 9 3.8l4.2 4.2-4.8 5.2zM6 13.2h7.5"/></svg></button>
          <i class="tsep"></i>
          <button class="tic" id="undoMark" title="復原（Ctrl+Z）" aria-label="復原"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5L2.5 6.5l3 3M2.5 6.5h7a4 4 0 0 1 0 8H7"/></svg></button>
          <button class="tic" id="clearMark" title="清除這格的批註" aria-label="清除這格的批註"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V2.5h4v2M4 4.5l.9 9.5h6.2l.9-9.5"/></svg></button>
        </div>
        <span class="grow"></span>
        <span class="seqstate" id="seqstate"></span>
        <button class="btn" id="grabSeq" title="把這卡逐格存起來，才能逐格看、畫批註">快取</button>
        <span class="stagetag" id="stagetag" hidden></span>
      </div>
      <div class="stagebox">
        <div class="stage" id="stage">
          <canvas id="frameCv"></canvas>
          <canvas id="drawCv"></canvas>
          <div class="empty" id="empty">按「讀入」從 AE 讀入目前的合成，或把圖檔拖進來</div>
        </div>
        <div class="dzhint" id="dzhint" hidden>放開以置換這卡的畫面</div>
      </div>

      <div class="transport">
        <button class="tbtn ico" id="fPrev" title="上一格（,）" aria-label="上一格"></button>
        <button class="tbtn ico main" id="fPlay" title="播放這一卡（Enter）" aria-label="播放這一卡"></button>
        <button class="tbtn ico" id="fNext" title="下一格（.）" aria-label="下一格"></button>
        <button class="tbtn ico" id="play" title="從這一卡開始播放全片（空白鍵）" aria-label="播放全片"></button>
        <span class="readout" id="readout"></span>
      </div>

      <div class="tl" id="tl">
        <div class="tl-scenes" id="tlScenes"></div>
        <div class="strip" id="strip"></div>
        <div class="ftrack" id="ftrack" hidden></div>
        <div class="tl-head" id="tlHead"></div>
      </div>

      <div class="cap">
        <div class="f"><span class="lab">畫面</span>
          <textarea id="fPic" placeholder="畫面內容"></textarea></div>
        <div class="f"><span class="lab">內容</span>
          <textarea id="fAct" placeholder="動作、攝影機運動"></textarea></div>
        <div class="f"><span class="lab">對白／音效</span>
          <textarea id="fSe" placeholder="對白與音效"></textarea></div>
      </div>
    </section>

    <nav class="mtabs" id="mTabs"><button data-t="cards">卡</button><button data-t="notes" class="on">意見<b id="mTabN"></b></button></nav>

    <aside class="insp">
      <div class="filt">
        <div class="chips" id="chips"></div>
        <button class="fold" id="inspFold" title="收起審閱欄（]）">»</button>
      </div>
      <div class="insp-head">
        <div>
          <button class="cutno" id="fNo" title="卡號照順序自動算">—</button>
